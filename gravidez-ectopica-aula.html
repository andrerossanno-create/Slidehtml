add({b:7,k:'7 · Encerramento',t:'A mensagem que precisa permanecer',
 body:`<p class="lead">Começamos com uma pergunta: por que um embrião, que deveria representar o início de uma nova vida, pode desencadear uma emergência hemorrágica?</p>
 ${S('<p>A resposta não está apenas no embrião. Está na relação entre <b>anatomia, transporte tubário, desenvolvimento embrionário, implantação, invasão trofoblástica</b> e a <b>capacidade do tecido materno</b> de sustentar a gestação.</p>')}
 ${S('<div class="callout teal big">A tuba pode permitir a fecundação, mas não oferece as mesmas condições do útero para sustentar a implantação.</div>')}
 ${S('<blockquote class="big">A gravidez ectópica não é apenas uma gravidez no lugar errado. É uma alteração da interação entre o tecido gestacional e o organismo materno.</blockquote>')}
 ${S('<div class="callout red">Compreender esses mecanismos permite reconhecer a doença <b>antes</b> que a paciente desenvolva uma complicação potencialmente fatal.</div>')}`,
 sc:[0,1,2,3,4,5,6],
 prof:{show:'Fala de encerramento revelada em etapas.',
  explain:`<p><b>Fala sugerida:</b> “Começamos nossa aula com uma pergunta: por que um embrião, que deveria representar o início de uma nova vida, pode desencadear uma emergência hemorrágica?</p>
  <p>Agora vocês sabem que a resposta não está apenas no embrião. Está na relação entre anatomia, transporte tubário, desenvolvimento embrionário, implantação, invasão trofoblástica e capacidade do tecido materno de sustentar a gestação.</p>
  <p>A tuba pode permitir a fecundação, mas não oferece as mesmas condições do útero para sustentar a implantação e o crescimento gestacional.</p>
  <p>Por isso, a gravidez ectópica não é apenas uma gravidez no lugar errado. É uma alteração da interação entre o tecido gestacional e o organismo materno.</p>
  <p>E o mais importante: compreender esses mecanismos permite reconhecer a doença antes que a paciente desenvolva uma complicação potencialmente fatal.”</p>`}
});

add({b:7,k:'7 · Para levar para casa',t:'Oito conceitos',
 body:`<p class="mut">Toque para virar. Peça a definição antes.</p><div class="grid g4">
 ${[['AMPOLA','Local habitual da fecundação e localização frequente da ectópica tubária.'],['TRANSPORTE','Cílios, secreções e musculatura tubária participam do deslocamento embrionário.'],['TROFOBLASTO','A invasão fisiológica pode causar lesão vascular em localização inadequada.'],['β-hCG','Demonstra atividade trofoblástica, mas não determina sozinho a localização.'],['DOR','Pode resultar de distensão tubária e irritação peritoneal.'],['SANGRAMENTO','Pode ser intraperitoneal mesmo com pouca exteriorização vaginal.'],['DIAGNÓSTICO','Depende da integração entre clínica, ultrassonografia e exames laboratoriais.'],['CONDUTA','A estabilidade hemodinâmica é decisiva para a urgência terapêutica.']].map(c=>`<div class="flip" data-act="flip"><div class="in"><div class="f">${c[0]}</div><div class="bk">${c[1]}</div></div></div>`).join('')}
 </div>`,
 sc:[0,1,2,3,4,5,6],
 prof:{show:'Oito cartões que viram.',
  explain:`<p><b>Oito conceitos que os alunos devem levar para casa:</b> AMPOLA — local habitual da fecundação e localização frequente da ectópica tubária. TRANSPORTE — cílios, secreções e musculatura tubária participam do deslocamento embrionário. TROFOBLASTO — a invasão fisiológica pode causar lesão vascular em localização inadequada. β-hCG — demonstra atividade trofoblástica, mas não determina sozinho a localização. DOR — pode resultar de distensão tubária e irritação peritoneal. SANGRAMENTO — pode ser intraperitoneal mesmo com pouca exteriorização vaginal. DIAGNÓSTICO — depende da integração entre clínica, ultrassonografia e exames laboratoriais. CONDUTA — a estabilidade hemodinâmica é decisiva para a urgência terapêutica.</p>`}
});

/* ---------- 3. Laboratório de β-hCG ---------- */
WIDGETS.hcg = function(w){
  w.innerHTML = `<div class="lab">
   <div class="card teal">
    <h3>Dados</h3>
    <div class="fld"><label for="h1">β-hCG inicial (mUI/mL)</label><input id="h1" type="number" inputmode="decimal" min="1" value="1000"></div>
    <div class="fld"><label for="h2">β-hCG seguinte (mUI/mL)</label><input id="h2" type="number" inputmode="decimal" min="1" value="1600"></div>
    <div class="fld"><label for="hh">Intervalo entre as coletas (horas)</label><input id="hh" type="number" inputmode="decimal" min="1" value="48"></div>
    <p class="mut" style="font-size:.72em">Exemplos rápidos:</p>
    <div class="chips">
     <button class="chip" data-p="1000,1600,48">Quadro: 1.000 → 1.600</button>
     <button class="chip" data-p="1200,2100,48">1.200 → 2.100</button>
     <button class="chip" data-p="2400,2700,48">2.400 → 2.700</button>
     <button class="chip" data-p="900,800,48">900 → 800</button>
     <button class="chip" data-p="2000,800,48">2.000 → 800</button>
     <button class="chip" data-p="1000,1300,24">1.000 → 1.300 em 24 h</button>
    </div>
   </div>
   <div class="card">
    <h3>Cálculo</h3>
    <div class="mut mono" style="font-size:.7em" id="hform"></div>
    <div class="res-big" id="hres">—</div>
    <div class="mut" id="hsub"></div>
    <div id="hverd"></div>
   </div></div>
   <div class="callout red" style="margin-top:12px"><b>O cálculo, isoladamente, não confirma localização nem viabilidade.</b> Sintomas e estabilidade hemodinâmica têm prioridade sobre qualquer interpretação isolada do β-hCG.</div>`;
  const calc = () => {
    const a=+$('#h1',w).value, b=+$('#h2',w).value, h=+$('#hh',w).value;
    const out=$('#hverd',w);
    if(!(a>0&&b>0&&h>0)){ $('#hres',w).textContent='—'; $('#hsub',w).textContent='Preencha valores positivos.'; out.innerHTML=''; $('#hform',w).textContent=''; return; }
    const pct=(b-a)/a*100;
    const eq48=(Math.pow(b/a,48/h)-1)*100;
    $('#hform',w).textContent=`(${fmt(b,0)} − ${fmt(a,0)}) ÷ ${fmt(a,0)} × 100`;
    $('#hres',w).textContent=(pct>0?'+':'')+fmt(pct)+'%';
    $('#hres',w).style.color = pct>0?'var(--teal)':'var(--amber)';
    let sub=`variação em ${fmt(h,0)} h`;
    if(Math.abs(h-48)>0.5) sub+=` · equivalente aproximado em 48 h (supondo cinética exponencial): ${(eq48>0?'+':'')+fmt(eq48)}%`;
    if(b>a) sub+=` · tempo de duplicação ≈ ${fmt(h*Math.LN2/Math.log(b/a))} h`;
    $('#hsub',w).textContent=sub;
    const v=[];
    if(h<48) v.push(['a','Intervalo','A NICE pede duas dosagens o mais próximo possível de 48 h — <b>nunca antes</b>. Use a conversão com cautela.']);
    const x = Math.abs(h-48)<=0.5 ? pct : eq48;
    // NICE PUL
    if(x>63) v.push(['g','NICE · PUL (aumento > 63%)','Padrão sugestivo de <b>gestação intrauterina em desenvolvimento</b> — <b>não exclui</b> ectópica. USTV em 7–14 dias (considerar mais cedo se hCG ≥ 1.500 UI/L).']);
    else if(x<-50) v.push(['b','NICE · PUL (queda > 50%)','Sugere gestação <b>em regressão</b>, não confirmada. Teste urinário em 14 dias; retorno se positivo ou se sintomas.']);
    else v.push(['a','NICE · PUL (padrão intermediário)','Aumento &lt; 63% ou queda &lt; 50%: <b>revisão clínica em até 24 h</b> no serviço de gestação inicial.']);
    // aumento mínimo por faixa
    if(x>0){
      const m = a<1500?49:(a<=3000?40:33);
      const faixa = a<1500?'< 1.500':(a<=3000?'1.500–3.000':'> 3.000');
      v.push([x>=m?'b':'r',`Aumento mínimo descrito para GIU viável (faixa inicial ${faixa}: ≈ ${m}%)`, x>=m?'Acima do mínimo estatístico da faixa — compatível com GIU viável, mas <b>ectópicas também podem subir assim</b>.':'Abaixo do mínimo estatístico da faixa — sugere gestação anormal (ectópica <b>ou</b> perda intrauterina). <b>Não localiza.</b>']);
    }
    if(x<=0) v.push(['r','Queda','Declínio hormonal <b>não exclui</b> ruptura de uma ectópica ainda presente.']);
    out.innerHTML = v.map(z=>`<div class="verdict ${z[0]}"><h4>${z[1]}</h4>${z[2]}</div>`).join('') + `<p class="mut" style="font-size:.7em">Os limiares da NICE (63% / 50%) e os aumentos mínimos por faixa (49% / 40% / 33%) vêm de abordagens diferentes e <b>não são intercambiáveis</b>. Faixas de 49/40/33%: conferir fonte primária (ver relatório científico).</p>`;
  };
  $$('input',w).forEach(i=>i.addEventListener('input',calc));
  $$('[data-p]',w).forEach(c=>c.addEventListener('click',()=>{ const p=c.dataset.p.split(','); $('#h1',w).value=p[0]; $('#h2',w).value=p[1]; $('#hh',w).value=p[2]; calc(); }));
  calc();
};

  <tr><td>Limiares de PUL 63% / 50%</td><td>conforme NICE</td><td>Confirmado (rec. 1.4.29–1.4.31). Padrão intermediário → revisão clínica em 24 h; não usar progesterona como adjuvante (1.4.32).</td><td class="ok">correto</td></tr>

/* =====================================================================
   MOTOR DA APRESENTAÇÃO — navegação, revelação, modo professor, widgets
   ===================================================================== */
const APP = (function(){
  const $ = (s,r=document)=>r.querySelector(s);
  const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
  const LS = 'aulaGE_rossanno_v1';
  const st = {i:0, prof:false, reduce:false, rev:{}, flows:{}, timer:{on:false, t0:0, acc:0, run:false}};
  let profWin = null;

  /* ---------- armazenamento leve (só posição e preferências; nunca respostas reveladas) ---------- */
  function save(){ try{ localStorage.setItem(LS, JSON.stringify({i:st.i, reduce:st.reduce})); }catch(e){} }
  function load(){ try{ const o = JSON.parse(localStorage.getItem(LS)||'{}'); if(typeof o.i==='number' && o.i<SLIDES.length) st.i=o.i; st.reduce=!!o.reduce; }catch(e){} }

  /* ---------- utilidades ---------- */
  function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast._h); toast._h=setTimeout(()=>t.classList.remove('on'),3200); }
  const qIdsIn = html => { const out=[]; const re=/data-qid="([^"]+)"/g; let m; while((m=re.exec(html))) out.push(m[1]); return out; };
  const tecIdsIn = html => { const out=[]; const re=/data-tec="(\d+)"/g; let m; while((m=re.exec(html))) out.push(+m[1]); return out; };
  const blockOf = s => BLOCKS[s.b];
  const fmt = n => n.toLocaleString('pt-BR',{maximumFractionDigits:1});

  /* ---------- render principal ---------- */
  function render(dir){
    const s = SLIDES[st.i], B = blockOf(s);
    document.documentElement.style.setProperty('--bc', `var(--${B.color})`);
    document.documentElement.style.setProperty('--bcs', `var(--${B.color}-s)`);
    $('#blockchip').textContent = `Bloco ${B.n} · ${B.short} · ${B.from}–${B.to} min`;
    const sc = s.sc || B.sc;
    const film = s.cover ? '' : `<div class="film" aria-label="Filme em sete cenas">${SCENES.map((n,i)=>`<span class="${sc.includes(i)?'on':''}"><i>${i+1}</i>${n}</span>`).join('')}</div>`;
    const meta = s.cover ? '' : `<div class="meta"><span class="kick">${(s.k||'').replace(/β-hCG/g,'<span class="nt">β-hCG</span>')}</span><span>Bloco ${B.n} · ${B.name}</span><span>⏱ ${B.from}–${B.to} min</span></div>`;
    const title = s.cover ? '' : `<h1 class="st">${s.t}</h1>`;
    let img = '';
    if(s.img){
      img = s.img.src ? `<img class="imgreal" src="${s.img.src}" alt="${s.img.tema}">`
        : `<div class="imgph"><b>[ESPAÇO OPCIONAL PARA IMAGEM: ${s.img.tema.toUpperCase()}]</b>Posição recomendada: ${s.img.pos}<br>Conceito a ilustrar: ${s.img.conceito}<br><span class="mut">Visível só no modo professor. Para inserir a figura, preencha <code>src</code> deste slide no bloco de dados.</span></div>`;
    }
    const el = $('#slide');
    el.innerHTML = meta + title + film + s.body + img + `<div class="hint-next" id="hintNext"></div>`;
    el.style.animation='none'; void el.offsetWidth; el.style.animation='';
    // passos
    const steps = $$('.step', el);
    if(dir<0) steps.forEach(x=>x.classList.add('on'));
    // estado de revelação
    $$('.q[data-qid]', el).forEach(applyQ);
    // fluxos
    $$('[data-flow]', el).forEach(fb=>{
      const id=fb.dataset.flow, nodes=$$('.fn',fb).length;
      const k = st.flows[st.i+':'+id];
      setFlow(fb, k!==undefined?k:(dir<0?nodes:1));
    });
    // widgets
    $$('[data-widget]', el).forEach(w=>{ const f=WIDGETS[w.dataset.widget]; if(f) try{ f(w); }catch(e){ console.error(e); w.innerHTML='<p class="c-red">Erro ao carregar este recurso.</p>'; } });
    $('#stage').scrollTop = 0;
    updateHint(); updateBottom(); renderProf(); save();
  }
  function updateHint(){
    const h=$('#hintNext'); if(!h) return;
    const left = $$('#slide .step:not(.on)').length;
    h.textContent = left ? `▸ ${left} etapa(s) a revelar — tecla → ou toque em ▶` : (st.i<SLIDES.length-1?'▸ próxima tela: →':'▸ fim da aula');
  }
  function updateBottom(){
    $('#count').textContent = `${st.i+1} / ${SLIDES.length}`;
    $('#prog i').style.width = ((st.i+1)/SLIDES.length*100)+'%';
  }

  /* ---------- perguntas ---------- */
  function applyQ(qel){
    const id = qel.dataset.qid, r = st.rev[id]||{};
    const has = slot => !!$(`[data-slot="${slot}"]`, qel);
    ['ans','deep','trap','add'].forEach(slot=>{ const e=$(`[data-slot="${slot}"]`, qel); if(e) e.hidden = !r[slot]; });
    const ba=$('[data-act="ans"]',qel); if(ba){ ba.classList.toggle('done',!!r.ans); ba.textContent = r.ans?'Resposta revelada':'Revelar resposta'; }
    ['deep','trap','add'].forEach(slot=>{ const b=$(`[data-act="${slot}"]`,qel); if(b){ b.hidden = !r.ans; b.classList.toggle('done',!!r[slot]); } });
  }
  function reveal(id, slot){
    st.rev[id] = st.rev[id]||{}; st.rev[id][slot] = true;
    const q = $(`#slide .q[data-qid="${id}"]`); if(q){ applyQ(q); if(slot==='ans'){ const st_=q.closest('.step'); if(st_) st_.classList.add('on'); } }
    renderProf();
  }
  function revealNextAnswer(){
    const qs = $$('#slide .q[data-qid]').filter(q=>!q.closest('.step:not(.on)'));
    for(const q of qs){ const id=q.dataset.qid; if(!(st.rev[id]&&st.rev[id].ans)){ reveal(id,'ans'); q.scrollIntoView({block:'center',behavior:st.reduce?'auto':'smooth'}); return; } }
    toast('Todas as respostas visíveis deste slide já foram reveladas.');
  }

  /* ---------- fluxos ---------- */
  function setFlow(fb, k){
    const nodes = $$('.fn', fb), n=nodes.length; k=Math.max(1,Math.min(n,k));
    $$('.fw', fb).forEach(e=>e.classList.toggle('on', +e.dataset.i < k));
    st.flows[st.i+':'+fb.dataset.flow]=k;
    const b=$('[data-act="fnext"]',fb); if(b){ b.disabled = k>=n; b.classList.toggle('done',k>=n); }
  }
  function flowStep(fb){ const k=st.flows[st.i+':'+fb.dataset.flow]||1; setFlow(fb,k+1); }

  /* ---------- navegação ---------- */
  function next(){
    // 0) caso clínico visível com dados ocultos? revela o próximo dado
    const cw = $$('#slide [data-widget="case"]').find(c=>!c.closest('.step:not(.on)') && c._next && !c._done());
    if(cw){ cw._next(); updateHint(); return; }
    // 1) fluxo visível incompleto? avança o fluxo
    const fb = $$('#slide [data-flow]').find(f=>!f.closest('.step:not(.on)') && (st.flows[st.i+':'+f.dataset.flow]||1) < $$('.fn',f).length);
    const nextStep = $('#slide .step:not(.on)');
    if(fb && (!nextStep || fb.compareDocumentPosition(nextStep) & Node.DOCUMENT_POSITION_FOLLOWING)){ flowStep(fb); fb.scrollIntoView({block:'nearest',behavior:st.reduce?'auto':'smooth'}); updateHint(); renderProf(); return; }
    if(nextStep){ nextStep.classList.add('on'); $$('[data-flow]',nextStep).forEach(f=>setFlow(f,st.flows[st.i+':'+f.dataset.flow]||1)); nextStep.scrollIntoView({block:'nearest',behavior:st.reduce?'auto':'smooth'}); updateHint(); renderProf(); return; }
    go(st.i+1, 1);
  }
  function prev(){ go(st.i-1, -1); }
  function go(i, dir){ if(i<0||i>=SLIDES.length) return; st.i=i; render(dir===undefined?1:dir); closeOv(); }

  /* ---------- modo professor ---------- */
  function setProf(on){ st.prof=on; document.body.classList.toggle('prof',on); $('#btnProf').classList.toggle('on',on); $('#btnProf').setAttribute('aria-pressed',on); renderProf(); }
  function profHTML(forWin){
    const s=SLIDES[st.i], B=blockOf(s), p=s.prof||{};
    const ids = qIdsIn(s.body);
    const qlist = ids.map(id=>{ const o=QS[id], r=st.rev[id]||{}; return `<div class="pq"><b>${o.label||('Pergunta '+id)}${o.nova?' (nova)':''}:</b> ${o.q}<br><button class="pqbtn${r.ans?' done':''}" data-act="ans" data-q="${id}">${r.ans?'✓ revelada na tela':'Revelar na tela'}</button></div>`; }).join('');
    const ans = ids.map(id=>{ const o=QS[id]; return `<div class="pq"><b>${o.label||('P'+id)}:</b> ${o.a}${o.model?' <i>(resposta-modelo)</i>':''}</div>`; }).join('');
    const deep = ids.filter(id=>QS[id].deep||QS[id].add).map(id=>`<div class="pq"><b>${QS[id].label||('P'+id)}:</b> ${QS[id].deep||''} ${QS[id].add?`<br><i>Diretriz (acréscimo):</i> ${QS[id].add}`:''}</div>`).join('');
    const traps = ids.filter(id=>QS[id].trap).map(id=>`<div class="pq"><b>${QS[id].label||('P'+id)}:</b> ${QS[id].trap}</div>`).join('');
    const tecs = [...new Set(tecIdsIn(s.body))].map(n=>`<div class="pq"><b>Técnica ${String(n).padStart(2,'0')} · ${TEC[n].nome}:</b> ${TEC[n].frase}<br>${TEC[n].ciencia}</div>`).join('');
    const sec = (L,title,html,open)=> html ? `<details ${open?'open':''}><summary><span class="L">${L}</span>${title}</summary><div class="pb">${html}</div></details>` : '';
    const left = $$('#slide .step:not(.on)').length;
    return `<div class="ph"><h4>Tela ${st.i+1}/${SLIDES.length} · Bloco ${B.n} · ${B.from}–${B.to} min</h4><span class="tfold">${left?left+' etapa(s) ocultas':'tudo visível'}</span></div>
      <div style="font-weight:900;font-size:1.1em;margin-bottom:6px">${s.cover?'Capa':s.t.replace(/<[^>]+>/g,'')}</div>
      ${forWin?`<div class="btns" style="margin:8px 0"><button class="bt" data-act="prev">◀ Voltar</button><button class="bt pri" data-act="next">Avançar ▶</button><button class="bt amb" data-act="nextans">Revelar próxima resposta</button></div>`:''}
      ${sec('A','O que mostrar',p.show?`<p>${p.show}</p>`:'',true)}
      ${sec('B','O que explicar',p.explain||'',true)}
      ${sec('C','O que perguntar',(p.ask?`<p>${p.ask}</p>`:'')+qlist,true)}
      ${sec('D','Resposta esperada',(p.answer?`<p>${p.answer}</p>`:'')+ans,false)}
      ${sec('E','Aprofundamento',(p.deep?`<p>${p.deep}</p>`:'')+deep,false)}
      ${sec('F','Pegadinha',(p.trap?`<p>${p.trap}</p>`:'')+traps,false)}
      ${sec('G','Macete',(p.tip?`<p>${p.tip}</p>`:'')+tecs,false)}`;
  }
  function renderProf(){
    if(st.prof){ const pp=$('#prof'); const open=$$('details',pp).map(d=>d.open); pp.innerHTML=profHTML(false); if(open.length) $$('details',pp).forEach((d,i)=>{ if(open[i]!==undefined) d.open=open[i]; }); }
    if(profWin && !profWin.closed){ try{ const c=profWin.document.getElementById('c'); if(c){ const open=$$('details',c).map(d=>d.open); c.innerHTML=profHTML(true); if(open.length) $$('details',c).forEach((d,i)=>{ if(open[i]!==undefined) d.open=open[i]; }); } }catch(e){} }
  }
  function openProfWin(){
    try{
      profWin = window.open('', 'aulaGE_prof', 'width=760,height=900');
      if(!profWin){ toast('O navegador bloqueou a janela. Use o modo professor (tecla P) nesta mesma tela.'); return; }
      const css = document.getElementById('mainCSS').textContent;
      profWin.document.open();
      profWin.document.write(`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notas do professor · Gravidez Ectópica</title><style>${css} body{overflow:auto} #prof{display:block!important;width:100%;max-height:none;border:0}</style></head><body class="prof"><div id="prof"><div id="c"></div></div></body></html>`);
      profWin.document.close();
      profWin.document.addEventListener('click', e=>{ const b=e.target.closest('[data-act]'); if(b) act(b); });
      profWin.document.addEventListener('keydown', onKey);
      renderProf(); toast('Janela do professor aberta. Mantenha esta tela no modo apresentação para os alunos.');
    }catch(e){ toast('Não foi possível abrir a segunda janela. Use o modo professor (P).'); }
  }

  /* ---------- ações (delegação) ---------- */
  function act(b){
    const a=b.dataset.act;
    if(a==='ans'||a==='deep'||a==='trap'||a==='add') return reveal(b.dataset.q, a);
    if(a==='next') return next();
    if(a==='prev') return prev();
    if(a==='nextans') return revealNextAnswer();
    if(a==='fnext'){ const fb=b.closest('[data-flow]')||$(`#slide [data-flow="${b.dataset.f}"]`); flowStep(fb); updateHint(); return; }
    if(a==='fall'){ const fb=b.closest('[data-flow]'); setFlow(fb,99); return; }
    if(a==='freset'){ const fb=b.closest('[data-flow]'); setFlow(fb,1); return; }
    if(a==='flip'){ b.classList.toggle('on'); return; }
    if(a==='revall'){ $$('#slide .q[data-qid]').forEach(q=>reveal(q.dataset.qid,'ans')); return; }
    if(a==='goto'){ go(+b.dataset.i,1); return; }
  }

  /* ---------- overlays ---------- */
  function openOv(id){ closeOv(); const o=$('#'+id); o.classList.add('on'); const f=$('.ovx',o); if(f) f.focus(); }
  function closeOv(){ $$('.ov.on').forEach(o=>o.classList.remove('on')); }
  function buildTOC(){
    let h='<h2>Sumário da aula</h2>';
    Object.values(BLOCKS).forEach(B=>{
      const items = SLIDES.map((s,i)=>({s,i})).filter(x=>x.s.b===B.n);
      h+=`<div class="toc-b"><h3 style="color:var(--${B.color})">Bloco ${B.n} · ${B.name}<small>${B.from}–${B.to} min · ${B.to-B.from} min</small></h3><ol>${items.map(x=>`<li><a data-act="goto" data-i="${x.i}" class="${x.i===st.i?'cur':''}">${x.s.cover?'Capa':x.s.t.replace(/<[^>]+>/g,'')}</a> <span class="mut mono" style="font-size:12px">${qIdsIn(x.s.body).filter(id=>/^\d+$/.test(id)).map(id=>'P'+id).join(' ')}</span></li>`).join('')}</ol></div>`;
    });
    $('#tocBody').innerHTML=h;
  }
  function buildScript(){
    let h='<h2>Roteiro integral do professor</h2><p class="mut">Leitura contínua de todas as notas, perguntas e respostas, na ordem da aula. Clique em um título para ir à tela.</p>';
    let lastB=0;
    SLIDES.forEach((s,i)=>{
      const B=blockOf(s), p=s.prof||{};
      if(B.n!==lastB){ h+=`<h2 style="color:var(--${B.color});margin-top:1.4em">Bloco ${B.n} · ${B.name} <span class="mut mono" style="font-size:13px">${B.from}–${B.to} min</span></h2>`; lastB=B.n; }
      const ids=qIdsIn(s.body);
      h+=`<div class="rt-s"><h3><a data-act="goto" data-i="${i}" style="color:var(--tx);cursor:pointer">${i+1}. ${s.cover?'Capa':s.t.replace(/<[^>]+>/g,'')}</a> <span class="mut mono" style="font-size:12px">${s.k||''}</span></h3>
      ${p.explain||''}
      ${ids.map(id=>{const o=QS[id];return `<div class="rq"><span class="lbl">${o.label||('Pergunta '+id)}${o.nova?' · nova':''}</span><p><b>${o.q}</b></p><p><b>Resposta${o.model?' (modelo)':''}:</b> ${o.a}</p>${o.deep?`<p><b>Aprofundamento:</b> ${o.deep}</p>`:''}${o.trap?`<p><b>Pegadinha:</b> ${o.trap}</p>`:''}${o.add?`<p><b>Diretriz (acréscimo):</b> ${o.add}</p>`:''}</div>`}).join('')}
      ${p.deep?`<p><span class="lbl">Aprofundamento</span><br>${p.deep}</p>`:''}
      ${p.trap?`<p><span class="lbl">Pegadinha</span><br>${p.trap}</p>`:''}
      ${p.tip?`<p><span class="lbl">Macete</span><br>${p.tip}</p>`:''}</div>`;
    });
    $('#scriptBody').innerHTML=h;
  }
  function buildReports(){ $('#repBody').innerHTML = REPORTS(); }

  /* ---------- cronômetro ---------- */
  function tElapsed(){ return st.timer.acc + (st.timer.run? (Date.now()-st.timer.t0):0); }
  function tick(){
    const ms=tElapsed(), m=Math.floor(ms/60000), s=Math.floor(ms/1000)%60;
    $('#tval').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    const B=blockOf(SLIDES[st.i]); let pace='';
    if(ms>0){ if(m<B.from) pace=`adiantado (bloco ${B.n} começa ${B.from}′)`; else if(m>B.to) pace=`${m-B.to}′ além do bloco ${B.n}`; else pace=`no tempo do bloco ${B.n}`; }
    $('#tpace').textContent=pace;
  }
  function tToggle(){ if(st.timer.run){ st.timer.acc=tElapsed(); st.timer.run=false; $('#tplay').textContent='▶'; } else { st.timer.t0=Date.now(); st.timer.run=true; $('#tplay').textContent='❚❚'; } }
  function tReset(){ st.timer={on:st.timer.on,t0:0,acc:0,run:false}; $('#tplay').textContent='▶'; tick(); }

  /* ---------- teclado e toque ---------- */
  function onKey(e){
    const tag=(e.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='select'||tag==='textarea') return; if((e.key===' '||e.key==='Enter') && (tag==='button'||tag==='summary'||e.target.getAttribute&&e.target.getAttribute('tabindex')==='0')) return;
    if(e.key==='Escape'){ closeOv(); return; }
    if($('.ov.on') && !['Escape'].includes(e.key)) return;
    const k=e.key;
    if(k==='ArrowRight'||k==='PageDown'||k===' '){ e.preventDefault(); next(); }
    else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); prev(); }
    else if(k==='Home'){ go(0,1); } else if(k==='End'){ go(SLIDES.length-1,1); }
    else if(k==='p'||k==='P'){ setProf(!st.prof); }
    else if(k==='m'||k==='M'){ buildTOC(); openOv('ovToc'); }
    else if(k==='s'||k==='S'){ buildScript(); openOv('ovScript'); }
    else if(k==='f'||k==='F'){ fullscreen(); }
    else if(k==='t'||k==='T'){ tToggle(); }
    else if(k==='a'||k==='A'){ revealNextAnswer(); }
  }
  function fullscreen(){ try{ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }catch(e){ toast('Tela cheia indisponível neste navegador.'); } }
  function swipe(){
    let x0=null,y0=null,t0=0; const el=$('#stage');
    el.addEventListener('touchstart',e=>{ if(e.target.closest('input,select,.svgbox,.order')) {x0=null;return;} x0=e.touches[0].clientX; y0=e.touches[0].clientY; t0=Date.now(); },{passive:true});
    el.addEventListener('touchend',e=>{ if(x0===null) return; const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0; if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.6 && Date.now()-t0<700){ dx<0?next():prev(); } x0=null; },{passive:true});
  }

  /* ---------- init ---------- */
  function init(){
    load();
    document.body.classList.toggle('reduce',st.reduce); $('#btnReduce').classList.toggle('on',st.reduce);
    document.addEventListener('click', e=>{ const b=e.target.closest('[data-act]'); if(b) act(b); });
    document.addEventListener('keydown', onKey);
    $('#btnNext').onclick=next; $('#btnPrev').onclick=prev;
    $('#btnProf').onclick=()=>setProf(!st.prof);
    $('#btnToc').onclick=()=>{ buildTOC(); openOv('ovToc'); };
    $('#btnScript').onclick=()=>{ buildScript(); openOv('ovScript'); };
    $('#btnRep').onclick=()=>{ buildReports(); openOv('ovRep'); };
    $('#btnWin').onclick=openProfWin;
    $('#btnFs').onclick=fullscreen;
    $('#btnTimer').onclick=()=>{ st.timer.on=!st.timer.on; $('#timer').classList.toggle('off',!st.timer.on); $('#btnTimer').classList.toggle('on',st.timer.on); };
    $('#btnReduce').onclick=()=>{ st.reduce=!st.reduce; document.body.classList.toggle('reduce',st.reduce); $('#btnReduce').classList.toggle('on',st.reduce); save(); };
    $('#btnResetRev').onclick=()=>{ st.rev={}; st.flows={}; render(1); toast('Respostas e fluxos ocultados novamente.'); };
    $('#tplay').onclick=tToggle; $('#treset').onclick=tReset;
    $$('.ovx').forEach(b=>b.onclick=closeOv);
    $$('.ov').forEach(o=>o.addEventListener('click',e=>{ if(e.target===o) closeOv(); }));
    $('#prog').addEventListener('click',e=>{ const r=e.currentTarget.getBoundingClientRect(); go(Math.min(SLIDES.length-1,Math.floor((e.clientX-r.left)/r.width*SLIDES.length)),1); });
    // marcadores de bloco na barra
    const pg=$('#prog'); Object.values(BLOCKS).forEach(B=>{ const i=SLIDES.findIndex(s=>s.b===B.n); if(i>0){ const m=document.createElement('span'); m.className='bm'; m.style.left=(i/SLIDES.length*100)+'%'; pg.appendChild(m);} });
    swipe(); setInterval(tick,500); tick();
    render(1);
  }
  return {init, go, next, prev, reveal, st, setFlow, qIdsIn, tecIdsIn, toast, render};
})();

APP.init();
</script>
</body>
</html>
