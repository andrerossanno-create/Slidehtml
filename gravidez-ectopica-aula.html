<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gravidez Ectópica · Aula Magna Interativa · Dr. André Rossanno</title>
<meta name="description" content="Aula magna interativa de 120 minutos: gravidez ectópica, da fecundação ao choque hemorrágico. Dr. André Rossanno.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Dancing+Script:wght@600&display=swap">
<style id="mainCSS">
:root{
  --bg:#08101f;--bg2:#0d182c;--card:#122039;--card2:#172947;--line:#24375b;
  --tx:#eef3fb;--tx2:#c3cfe3;--mut:#8b9bb9;
  --blue:#5aa9ff;--blue-s:rgba(90,169,255,.13);
  --teal:#2dd4bf;--teal-s:rgba(45,212,191,.13);
  --amber:#f6b73c;--amber-s:rgba(246,183,60,.13);
  --red:#ff6161;--red-s:rgba(255,97,97,.14);
  --green:#4ade80;--green-s:rgba(74,222,128,.12);
  --gold:#e9c46a;
  --bc:var(--blue);--bcs:var(--blue-s);
  --fs:clamp(17px, .95vw + 9px, 29px);
  --ff:'Nunito','Trebuchet MS',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --sig:'Dancing Script','Brush Script MT',cursive;
  --top:58px;--bot:62px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 700px at 85% -10%,#132a4d 0%,transparent 60%),radial-gradient(900px 600px at -10% 110%,#0f2a33 0%,transparent 55%),var(--bg);color:var(--tx);font-family:var(--ff);font-size:var(--fs);line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- top bar ---------- */
#top{position:fixed;inset:0 0 auto 0;height:var(--top);display:flex;align-items:center;gap:10px;padding:0 14px;background:rgba(8,16,31,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:30;font-size:15px}
#brand{font-weight:900;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#brand small{font-family:var(--mono);font-weight:500;color:var(--mut);font-size:12px;margin-left:8px}
#blockchip{font-family:var(--mono);font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--bc);color:var(--bc);background:var(--bcs);white-space:nowrap}
.sp{flex:1}
.tb{flex:none;background:transparent;border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:14px;font-weight:700;color:var(--tx2);white-space:nowrap;min-height:38px}
.tb:hover{border-color:var(--tx2);color:var(--tx)}
.tb.on{background:var(--amber);border-color:var(--amber);color:#1a1200}
#timer{font-family:var(--mono);font-size:14px;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:4px 8px}
#timer b{font-weight:600;min-width:58px;text-align:center}
#timer .pace{font-size:11px;color:var(--mut)}
#timer button{background:none;border:0;color:var(--tx2);padding:4px 6px;font-size:14px}
#timer.off{display:none}

/* ---------- stage ---------- */
#wrap{position:fixed;top:var(--top);bottom:var(--bot);left:0;right:0;display:flex}
#stage{flex:1;overflow-y:auto;overflow-x:hidden;padding:clamp(16px,3vw,48px) clamp(16px,4vw,72px) 60px;scroll-behavior:smooth}
#slide{max-width:1280px;margin:0 auto;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.reduce *{animation:none!important;transition:none!important}
.meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-family:var(--mono);font-size:max(12px,.55em);color:var(--mut);margin-bottom:.4em}
.meta .kick{color:var(--bc);text-transform:uppercase;letter-spacing:1.5px;font-weight:600}
h1.st{font-size:clamp(28px,2.4vw + 14px,66px);line-height:1.12;margin:.1em 0 .5em;font-weight:900;letter-spacing:-.5px}
h1.st .acc{color:var(--bc)}
h2{font-size:1.18em;margin:1em 0 .4em;font-weight:800}
h3{font-size:1.02em;margin:.6em 0 .3em;font-weight:800}
p{margin:.45em 0}
.lead{font-size:1.15em;color:var(--tx2)}
.big{font-size:1.45em;font-weight:800;line-height:1.25}
.mut{color:var(--mut)}
.mono{font-family:var(--mono)}
b,strong{font-weight:800}
.c-blue{color:var(--blue)}.c-teal{color:var(--teal)}.c-amber{color:var(--amber)}.c-red{color:var(--red)}.c-green{color:var(--green)}.c-gold{color:var(--gold)}

/* film strip */
.film{display:flex;gap:6px;margin:0 0 1em;flex-wrap:wrap}
.film span{font-family:var(--mono);font-size:max(10px,.42em);letter-spacing:1px;padding:4px 8px;border-radius:6px;border:1px solid var(--line);color:var(--mut);background:rgba(255,255,255,.02)}
.film span.on{color:#071019;background:var(--bc);border-color:var(--bc);font-weight:700}
.film span i{font-style:normal;opacity:.6;margin-right:4px}

/* cards & grids */
.grid{display:grid;gap:clamp(10px,1.2vw,22px)}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:clamp(14px,1.3vw,26px);position:relative}
.card.blue{border-color:rgba(90,169,255,.5)}.card.teal{border-color:rgba(45,212,191,.5)}.card.amber{border-color:rgba(246,183,60,.55)}.card.red{border-color:rgba(255,97,97,.55)}.card.green{border-color:rgba(74,222,128,.5)}
.card h3{margin-top:0}
.tag{display:inline-block;font-family:var(--mono);font-size:max(11px,.5em);letter-spacing:1px;text-transform:uppercase;padding:3px 9px;border-radius:99px;border:1px solid currentColor;margin-bottom:.5em}
.callout{border-left:5px solid var(--bc);background:var(--bcs);padding:.7em 1em;border-radius:0 14px 14px 0;margin:.8em 0}
.callout.red{border-color:var(--red);background:var(--red-s)}.callout.amber{border-color:var(--amber);background:var(--amber-s)}.callout.teal{border-color:var(--teal);background:var(--teal-s)}.callout.green{border-color:var(--green);background:var(--green-s)}.callout.blue{border-color:var(--blue);background:var(--blue-s)}
blockquote{margin:.8em 0;padding:.6em 1em;border-left:4px solid var(--gold);font-size:1.12em;font-weight:700;color:var(--tx);background:rgba(233,196,106,.07);border-radius:0 12px 12px 0}
ul.clean{list-style:none;padding:0;margin:.4em 0}
ul.clean li{padding:.28em 0 .28em 1.3em;position:relative}
ul.clean li::before{content:"";position:absolute;left:.15em;top:.85em;width:.45em;height:.45em;border-radius:50%;background:var(--bc)}
table.tt{width:100%;border-collapse:collapse;font-size:.9em;margin:.6em 0}
table.tt th,table.tt td{border-bottom:1px solid var(--line);padding:.5em .6em;text-align:left;vertical-align:top}
table.tt th{font-family:var(--mono);font-size:.7em;letter-spacing:1px;text-transform:uppercase;color:var(--mut);font-weight:600}
.tablewrap{overflow-x:auto}

/* steps */
.step:not(.on){display:none}
.step.on{animation:fadeIn .35s ease}
.hint-next{font-family:var(--mono);font-size:max(11px,.5em);color:var(--mut);margin-top:1.2em;text-align:center}

/* question cards */
.q{border:1px solid var(--line);border-radius:18px;padding:clamp(14px,1.2vw,24px);margin:.9em 0;background:rgba(255,255,255,.025)}
.q .ql{font-family:var(--mono);font-size:max(11px,.52em);letter-spacing:1.4px;text-transform:uppercase;color:var(--amber);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.q .ql .new{color:var(--teal);border:1px solid var(--teal);padding:1px 6px;border-radius:6px}
.q .qt{font-size:1.18em;font-weight:800;margin:.35em 0 .6em;line-height:1.3}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.bt{border:1.5px solid var(--line);background:var(--bg2);border-radius:12px;padding:.42em .95em;font-weight:800;font-size:.78em;min-height:44px;transition:border-color .15s,background .15s}
.bt:hover{border-color:var(--tx2)}
.bt.pri{border-color:var(--teal);color:var(--teal)}
.bt.amb{border-color:var(--amber);color:var(--amber)}
.bt.red{border-color:var(--red);color:var(--red)}
.bt.blu{border-color:var(--blue);color:var(--blue)}
.bt.done{opacity:.45}
.ans{margin-top:.75em;padding:.75em 1em;border-radius:14px;background:var(--teal-s);border:1px solid rgba(45,212,191,.35);animation:fadeIn .3s ease}
.ans.deep{background:var(--blue-s);border-color:rgba(90,169,255,.35)}
.ans.trap{background:var(--amber-s);border-color:rgba(246,183,60,.45)}
.ans.add{background:rgba(233,196,106,.06);border-color:rgba(233,196,106,.35);border-style:dashed}
.ans .al{font-family:var(--mono);font-size:max(10px,.5em);letter-spacing:1.3px;text-transform:uppercase;opacity:.8;display:block;margin-bottom:.2em}

/* technique */
.tec{border-radius:20px;padding:clamp(14px,1.3vw,26px);margin:.9em 0;background:linear-gradient(135deg,rgba(233,196,106,.16),rgba(45,212,191,.08));border:1.5px solid rgba(233,196,106,.55);position:relative}
.tec .tn{font-family:var(--mono);font-size:max(11px,.52em);letter-spacing:1.5px;text-transform:uppercase;color:var(--gold)}
.tec .tp{font-size:1.32em;font-weight:900;line-height:1.25;margin:.25em 0}
.tec .ts{color:var(--tx2);font-size:.88em}

/* flows */
.flow{display:flex;flex-direction:column;gap:0;margin:.6em 0}
.flow.h{flex-direction:row;flex-wrap:wrap;align-items:stretch}
.fn{border:1.5px solid var(--bc);background:var(--bcs);border-radius:14px;padding:.55em .9em;font-weight:700}
.fn small{display:block;font-weight:500;color:var(--tx2);font-size:.82em;margin-top:.15em}
.fa{color:var(--bc);text-align:center;font-size:1.1em;line-height:1;padding:.18em 0}
.flow.h .fa{display:flex;align-items:center;padding:0 .3em}
.fw:not(.on){display:none}
.fw.on{animation:fadeIn .3s ease}
.fn.red{border-color:var(--red);background:var(--red-s)}.fn.amber{border-color:var(--amber);background:var(--amber-s)}.fn.teal{border-color:var(--teal);background:var(--teal-s)}.fn.green{border-color:var(--green);background:var(--green-s)}.fn.blue{border-color:var(--blue);background:var(--blue-s)}
.flowctl{margin-top:.6em}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:.5em 0}
.chip{border:1.5px solid var(--line);border-radius:99px;padding:.3em .85em;font-size:.82em;font-weight:700;background:var(--bg2)}
button.chip{min-height:44px}
.chip.on{border-color:var(--bc);background:var(--bcs);color:var(--tx)}

/* image placeholder */
.imgph{border:2px dashed rgba(233,196,106,.6);border-radius:16px;padding:1em;margin:1em 0;color:var(--gold);font-size:.75em;background:rgba(233,196,106,.05)}
.imgph b{display:block;font-family:var(--mono);letter-spacing:1px}
body:not(.prof) .imgph{display:none}
.imgreal{max-width:100%;border-radius:16px;margin:1em 0;display:block}

/* SVG widgets */
.svgbox{background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:18px;padding:10px;margin:.6em 0}
.svgbox svg{width:100%;height:auto;display:block}
.tube-seg{cursor:pointer;transition:filter .2s,opacity .2s}
.tube-seg:hover{filter:brightness(1.25)}
.tube-seg.dim{opacity:.35}
.tube-lbl{font-family:var(--ff);font-weight:800;fill:#eef3fb;font-size:15px;pointer-events:none}
.tube-info{min-height:4.5em}

/* timeline */
.tl{position:relative;margin:.8em 0}
.tl-track{height:8px;border-radius:8px;background:var(--line);position:relative;margin:28px 6px 16px}
.tl-fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--blue),var(--teal));border-radius:8px;width:0;transition:width .5s}
.tl-dot{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 6px rgba(233,196,106,.25);left:0;transition:left .5s}
.tl-zone{position:absolute;top:-24px;font-family:var(--mono);font-size:11px;color:var(--mut);transform:translateX(-50%);white-space:nowrap}
.tl-list{display:grid;gap:8px}
.tl-item{display:grid;grid-template-columns:minmax(90px,150px) 1fr;gap:12px;align-items:start;padding:.5em .8em;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.02)}
.tl-item .d{font-family:var(--mono);color:var(--teal);font-weight:600;font-size:.85em}
.tl-item:not(.on){display:none}
.tl-item.cur{border-color:var(--teal);background:var(--teal-s)}

/* lab */
.lab{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.fld label{font-family:var(--mono);font-size:max(11px,.55em);letter-spacing:.5px;color:var(--mut)}
.fld input,.fld select{font:inherit;font-size:1em;font-weight:800;background:var(--bg);color:var(--tx);border:1.5px solid var(--line);border-radius:12px;padding:.35em .6em;min-height:46px;width:100%}
.fld input:focus,.fld select:focus{border-color:var(--teal);outline:none}
.res-big{font-size:2.2em;font-weight:900;line-height:1.05;font-family:var(--mono)}
.verdict{padding:.6em .9em;border-radius:12px;margin:.5em 0;border:1px solid var(--line);font-size:.88em}
.verdict.g{border-color:rgba(74,222,128,.5);background:var(--green-s)}
.verdict.a{border-color:rgba(246,183,60,.55);background:var(--amber-s)}
.verdict.r{border-color:rgba(255,97,97,.55);background:var(--red-s)}
.verdict.b{border-color:rgba(90,169,255,.5);background:var(--blue-s)}
.verdict h4{margin:0 0 .2em;font-size:.82em;font-family:var(--mono);letter-spacing:1px;text-transform:uppercase}
.toggle-row{display:flex;flex-wrap:wrap;gap:8px;margin:.3em 0 .8em}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{background:var(--bg2);border:0;padding:.35em .8em;font-weight:800;font-size:.78em;min-height:44px}
.seg button.on{background:var(--teal);color:#05201c}

/* shock meter */
.meter{height:18px;border-radius:9px;background:var(--line);overflow:hidden;margin:.25em 0 .7em}
.meter i{display:block;height:100%;border-radius:9px;transition:width .35s,background .35s}
input[type=range]{width:100%;accent-color:var(--red);min-height:40px}

/* order game */
.order{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:10px;border:1.5px dashed var(--line);border-radius:14px;margin:.4em 0}
.order .chip{cursor:pointer}
.order .chip.ok{border-color:var(--green);background:var(--green-s)}
.order .chip.bad{border-color:var(--red);background:var(--red-s)}

/* flip cards */
.flip{perspective:1200px;min-height:9em;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;min-height:9em;transition:transform .6s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .bk{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:1em;display:flex;align-items:center;justify-content:center;text-align:center;border:1.5px solid var(--line)}
.flip .f{background:linear-gradient(160deg,var(--card2),var(--card));font-weight:900;font-size:1.25em;letter-spacing:1px;color:var(--gold)}
.flip .bk{transform:rotateY(180deg);background:var(--teal-s);border-color:var(--teal);font-weight:700;font-size:.9em}

/* cover */
.cover{min-height:calc(100vh - var(--top) - var(--bot) - 80px);display:flex;flex-direction:column;justify-content:center}
.cover .kk{font-family:var(--mono);letter-spacing:3px;text-transform:uppercase;color:var(--teal);font-size:.62em}
.cover h1{font-size:clamp(40px,5.2vw,112px);line-height:1;margin:.2em 0 .15em;font-weight:900;letter-spacing:-1.5px}
.cover h1 span{background:linear-gradient(90deg,var(--blue),var(--teal) 55%,var(--red));-webkit-background-clip:text;background-clip:text;color:transparent}
.cover .sub{font-size:1.35em;color:var(--tx2);font-weight:700;max-width:30em}
.sigline{font-family:var(--sig);font-size:2em;color:var(--gold);margin-top:.6em}
.cover .info{font-family:var(--mono);font-size:.6em;color:var(--mut);margin-top:.8em;letter-spacing:1px}

/* bottom nav */
#bot{position:fixed;inset:auto 0 0 0;height:var(--bot);display:flex;align-items:center;gap:10px;padding:0 14px;background:rgba(8,16,31,.94);border-top:1px solid var(--line);z-index:30;font-size:14px}
#bot .nb{border:1.5px solid var(--line);background:var(--bg2);border-radius:12px;min-width:52px;min-height:44px;font-size:20px;font-weight:900}
#bot .nb:hover{border-color:var(--teal)}
#prog{flex:1;height:8px;border-radius:8px;background:var(--line);position:relative;overflow:hidden;cursor:pointer}
#prog i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--blue),var(--teal),var(--amber),var(--red));border-radius:8px;transition:width .3s}
#prog .bm{position:absolute;top:0;bottom:0;width:2px;background:var(--bg)}
#count{font-family:var(--mono);font-size:12px;color:var(--mut);white-space:nowrap}

/* professor panel */
#prof{width:min(44vw,640px);border-left:1px solid var(--line);background:#0b1426;overflow-y:auto;padding:16px 18px 40px;font-size:15px;line-height:1.55;display:none}
body.prof #prof{display:block}
#prof h4{font-family:var(--mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--amber);margin:0 0 6px}
#prof .ph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
#prof details{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:rgba(255,255,255,.02)}
#prof summary{cursor:pointer;padding:9px 12px;font-weight:800;list-style:none;display:flex;gap:8px;align-items:center}
#prof summary::-webkit-details-marker{display:none}
#prof summary .L{font-family:var(--mono);font-size:12px;width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;background:var(--line);flex:none}
#prof details[open] summary .L{background:var(--amber);color:#1a1200}
#prof .pb{padding:0 12px 12px;color:var(--tx2)}
#prof .pb p{margin:.4em 0}
#prof .pq{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
#prof .pq b{color:var(--tx)}
#prof .pqbtn{font-size:12px;padding:4px 8px;border-radius:8px;border:1px solid var(--teal);background:none;color:var(--teal);margin-top:4px;min-height:32px}
#prof .pqbtn.done{opacity:.4}
.d-A .L{}
#prof .tfold{font-size:12px;color:var(--mut);font-family:var(--mono)}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(3,7,15,.82);backdrop-filter:blur(6px);z-index:60;display:none;padding:clamp(10px,3vw,40px)}
.ov.on{display:flex;justify-content:center}
.ovb{background:var(--bg2);border:1px solid var(--line);border-radius:20px;width:min(1100px,100%);max-height:100%;overflow-y:auto;padding:clamp(16px,2.5vw,36px);font-size:16px;position:relative}
.ovb h2{margin-top:0;font-size:1.6em}
.ovx{position:sticky;top:0;float:right;border:1px solid var(--line);background:var(--bg);border-radius:10px;min-width:44px;min-height:44px;font-size:20px;z-index:2}
.toc-b{margin:14px 0}
.toc-b h3{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.toc-b h3 small{font-family:var(--mono);color:var(--mut);font-weight:500;font-size:12px}
.toc-b ol{margin:4px 0;padding-left:1.4em}
.toc-b li{padding:2px 0}
.toc-b a{color:var(--tx2);text-decoration:none;cursor:pointer}
.toc-b a:hover,.toc-b a.cur{color:var(--teal)}
.rt-s{border-top:1px solid var(--line);padding:14px 0}
.rt-s h3{margin:0 0 6px}
.rt-s .rq{border-left:3px solid var(--amber);padding-left:10px;margin:8px 0}
.rt-s .lbl{font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--amber)}
.rep h3{color:var(--teal)}
.rep table{font-size:14px}
.ok{color:var(--green);font-weight:800}
.warn{color:var(--amber);font-weight:800}

/* ---------- As 10 técnicas aprovadas (texto aprovado — não alterar) ---------- */
const TEC = {
 1:{nome:'A-T-U',frase:'“AMPOLA fecunda, TUBA transporta, ÚTERO implanta.”',uso:'Anatomia tubária, fecundação e implantação.',
    ciencia:'Cada estrutura tem uma função na sequência: a ampola oferece o ambiente do encontro dos gametas; a tuba (cílios, secreção e musculatura) desloca o embrião enquanto ele se divide; o endométrio decidualizado recebe o blastocisto e regula a invasão.'},
 2:{nome:'O EMBRIÃO PERDEU O UBER',frase:'“O embrião tinha destino: ÚTERO. O transporte falhou e ele ficou na TUBA.”',uso:'Transporte embrionário, motilidade tubária, cílios e alterações funcionais.',
    ciencia:'Explicação científica: o transporte tubário resulta de mecanismos integrados — batimento ciliar, secreção e contração da musculatura lisa — coordenados com o desenvolvimento embrionário. Se inflamação, cirurgia ou tabagismo retardam esse transporte, o embrião atinge a fase de implantação (blastocisto, dias 6–7) ainda dentro da tuba.'},
 3:{nome:'O TROFOBLASTO É UM PEDREIRO NO ENDEREÇO ERRADO',frase:'“No útero, constrói a placenta. Na tuba, pode destruir vasos.”',uso:'Invasão trofoblástica, decidualização, lesão vascular e hemorragia.',
    ciencia:'No endométrio decidualizado a invasão é regulada e estabelece a interface materno-embrionária. A tuba não possui decidualização fisiológica equivalente e tem parede delgada: a mesma atividade invasiva pode erodir vasos e causar sangramento.'},
 4:{nome:'O GPS DO β-hCG ESTÁ DESLIGADO',frase:'“β-hCG POSITIVO? Existe sinal trofoblástico. Mas CADÊ a gestação?”',uso:'Produção hormonal e diagnóstico.',
    ciencia:'O β-hCG isoladamente não determina a localização gestacional. Ele informa presença e evolução da atividade trofoblástica; o “endereço” vem da ultrassonografia integrada à clínica.'},
 5:{nome:'A CASA VAZIA',frase:'“CASA VAZIA não prova morador no vizinho.”',uso:'Ultrassonografia transvaginal.',
    ciencia:'Útero vazio, isoladamente, não confirma gestação ectópica: pode ser gestação intrauterina muito inicial, gestação em regressão ou ectópica. É preciso procurar o “vizinho” (massa anexial separada do ovário) e integrar clínica e β-hCG.'},
 6:{nome:'O OMBRO DENUNCIA O DIAFRAGMA',frase:'“C3, C4, C5: sangue irrita o diafragma, dor aparece no ombro.”',uso:'Hemoperitônio, nervo frênico e dor referida.',

 7:{nome:'A PRESSÃO É A ÚLTIMA A CONFESSAR',frase:'“O pulso GRITA antes de a pressão CAIR.”',uso:'Compensação simpática e choque hemorrágico.',
    ciencia:'Ressalvas obrigatórias: nem toda hemorragia produz taquicardia, e pressão normal não exclui hipoperfusão. Avalie perfusão, estado mental, tendência da FC, dor e sinais peritoneais.'},
 8:{nome:'PUL',frase:'“Positivo, Ultrassom não Localizou.”',uso:'Pregnancy of Unknown Location (gestação de localização desconhecida).',
    ciencia:'PUL é uma classificação temporária, não a confirmação de ectópica. Pode evoluir para gestação intrauterina, gravidez ectópica ou gestação em regressão.'},
 9:{nome:'OS TRÊS CAMINHOS',frase:'“OBSERVAR se elegível, MEDICAR se elegível, OPERAR se necessário. Instabilidade não espera.”',uso:'Modalidades terapêuticas e seleção clínica.',
    ciencia:'O macete organiza o raciocínio; não é um protocolo terapêutico absoluto. Os critérios de elegibilidade dependem de diretriz, protocolo institucional, possibilidade de seguimento e preferência da paciente.'},
 10:{nome:'O FILME EM SETE CENAS',frase:'“AMPOLA → TRANSPORTE → IMPLANTAÇÃO → INVASÃO → SANGRAMENTO → DIAGNÓSTICO → CONDUTA.”',uso:'Palácio da Memória integrador (abertura e encerramento).',

/* ---------- Perguntas: 1–40 (numeração original), 3b (aprofundamento do roteiro), R1–R7 (revisão final)
   q = enunciado · a = resposta · deep = aprofundamento · trap = pegadinha · add = acréscimo (identificado) ---------- */
const QS = {
 1:{q:'Onde ocorre normalmente a fecundação?',a:'Na ampola da tuba uterina.',
    deep:'A ampola oferece um ambiente adequado ao encontro dos gametas. Isso envolve o transporte espermático, a capacitação dos espermatozoides, o movimento ciliar, a composição do fluido tubário e o tempo de permanência dos gametas.'},
 2:{q:'Se a fecundação ocorre na ampola, por que a gestação normalmente não se implanta ali?',a:'Porque o embrião precisa percorrer a tuba até a cavidade uterina enquanto passa pelas primeiras divisões celulares. O transporte tubário e o desenvolvimento embrionário precisam estar temporalmente coordenados.',
    deep:'Esse é um dos conceitos centrais da aula: não basta o embrião estar vivo; ele precisa chegar ao local apropriado no momento adequado.'},
 3:{q:'Uma mulher que teve salpingite pode continuar ovulando normalmente e, mesmo assim, apresentar infertilidade ou gravidez ectópica?',a:'Sim. A salpingite pode comprometer a arquitetura mucosa, a atividade ciliar, a permeabilidade tubária e a motilidade. Assim, o ovário pode continuar funcionando, mas o transporte do embrião torna-se inadequado.'},
 '3b':{label:'Pergunta 3 · aprofundamento',q:'Por que a mesma doença pode provocar infertilidade em uma paciente e gravidez ectópica em outra?',a:'Porque o dano tubário pode ter diferentes graus. Uma obstrução completa pode impedir o encontro dos gametas ou a passagem embrionária. Uma lesão parcial pode permitir a fecundação, mas retardar o transporte, favorecendo a implantação ectópica.'},
 4:{q:'O trofoblasto é uma estrutura agressiva?',a:'Ele possui capacidade fisiológica de adesão, invasão e remodelamento tecidual. Essa capacidade é regulada por mecanismos moleculares e pela interação com os tecidos maternos.',
    deep:'Analogia: “O trofoblasto é uma equipe de construção especializada em estabelecer a interface materno-embrionária. No endométrio, encontra um ambiente biologicamente preparado. Na tuba, a mesma atividade invasiva pode lesar estruturas que não oferecem condições equivalentes de acomodação.”'},
 5:{q:'A gravidez ectópica ocorre porque o embrião está defeituoso?',a:'Não necessariamente. Uma gravidez ectópica pode resultar de alterações no transporte embrionário, nas condições tubárias e nas interações locais entre embrião e tecido materno. Alterações embrionárias podem coexistir, mas não explicam isoladamente a maioria dos casos.'},
 6:{q:'Se o embrião está na tuba, por que o teste de gravidez fica positivo?',a:'Porque o teste identifica hCG, e não a localização anatômica do embrião.',
    deep:'Frase para fixação: “O β-hCG informa que existe atividade trofoblástica, mas não revela o endereço da gestação.” Essa distinção será fundamental no bloco diagnóstico.'},
 7:{q:'Se a paciente tratou a infecção, por que o risco de ectópica pode continuar aumentado?',a:'Porque eliminar o agente infeccioso não significa necessariamente recuperar integralmente a anatomia e a função tubárias.'},
 8:{q:'Uma tuba anatomicamente pérvia é necessariamente uma tuba funcional?',a:'Não. A permeabilidade não garante integridade ciliar, secreção normal ou transporte embrionário adequado.'},
 9:{q:'Se a ultrassonografia mostra uma gestação intrauterina, podemos excluir totalmente gravidez ectópica?',a:'Não em todas as circunstâncias. A gestação heterotópica é rara na concepção espontânea, mas ocorre com maior frequência após técnicas de reprodução assistida. Por isso, sintomas e achados anexiais suspeitos não devem ser ignorados apenas porque existe uma gestação intrauterina.',
    add:'NICE NG126 (rec. 1.4.21): ao realizar a ultrassonografia no início da gestação, examinar útero e anexos para verificar a possibilidade de gestação heterotópica.'},
 10:{q:'Então o DIU provoca gravidez ectópica?',a:'Essa conclusão é incorreta. O dispositivo reduz a ocorrência total de gestações. O ponto clínico é que uma gravidez diagnosticada durante seu uso exige avaliação cuidadosa da localização.',
    trap:'Risco ABSOLUTO cai (menos gestações no total, inclusive ectópicas); a PROPORÇÃO de ectópicas entre as poucas falhas é maior. Confundir proporção com risco é o erro.'},
 11:{q:'Uma paciente pode apresentar hemoperitônio por gravidez ectópica sem ruptura tubária completa?',a:'Sim. O aborto tubário e outras formas de sangramento tubário podem provocar hemoperitônio.'},
 12:{q:'Por que algumas pacientes apresentam dor no ombro?',a:'O sangue intraperitoneal pode irritar o diafragma, produzindo dor referida por aferências associadas ao nervo frênico, cujas raízes se originam principalmente de C3 a C5.',
    deep:'Macete do roteiro: “C3, C4, C5: o diafragma avisa no ombro.” A dor no ombro não é específica, mas, no contexto de gestação inicial com dor abdominal e suspeita de hemorragia, deve aumentar a preocupação clínica.'},
 13:{q:'Se o sangue está saindo pela vagina, isso significa que a gestação estava dentro do útero?',a:'Não. O sangramento vaginal pode ter origem na descamação endometrial associada à gestação ectópica.'},
 14:{q:'Por que a taquicardia pode surgir antes da hipotensão?',a:'Porque a ativação simpática é um mecanismo compensatório inicial para tentar preservar o débito cardíaco e a perfusão dos órgãos vitais.'},
 15:{q:'Uma paciente jovem, com frequência cardíaca de 118 bpm e pressão de 110 × 70 mmHg, está necessariamente estável?',a:'Não. A pressão arterial isolada não define estabilidade. É preciso avaliar perfusão periférica, estado mental, evolução da frequência cardíaca, dor, sangramento, sinais de irritação peritoneal e outros indicadores clínicos.',
    add:'NICE NG126 (rec. 1.3.4) lista entre os sinais possíveis de ectópica: taquicardia (> 100 bpm) ou hipotensão (< 100/60 mmHg), choque/colapso e hipotensão ortostática.'},
 16:{q:'Uma hemoglobina de 12 g/dL exclui hemoperitônio importante?',a:'Não. O contexto clínico e hemodinâmico é mais importante do que uma hemoglobina isolada na avaliação inicial da hemorragia aguda.',
    deep:'Mensagem para o quadro: “Na hemorragia aguda, a clínica pode se deteriorar antes de o hemograma revelar toda a gravidade.”'},
 17:{q:'Qual é a primeira pergunta diante de uma paciente com dor abdominal e gravidez confirmada?',a:'A paciente está hemodinamicamente estável? A resposta determina a urgência da investigação e da intervenção.'},
 18:{q:'A ausência de sangramento vaginal exclui gravidez ectópica?',a:'Não. A paciente pode apresentar sangramento intraperitoneal sem exteriorização vaginal significativa.'},
 19:{q:'A ausência de fatores de risco exclui gravidez ectópica?',a:'Não. Uma proporção relevante de pacientes não apresenta fatores de risco identificáveis.',
    add:'NICE NG126 (rec. 1.3.8): cerca de um terço das mulheres com gravidez ectópica não tem fator de risco conhecido.'},
 20:{q:'Uma paciente tem β-hCG de 2.400 mUI/mL. Isso prova que a gravidez está dentro do útero?',a:'Não.',
    deep:'O valor absoluto mede quantidade de atividade trofoblástica, não o endereço (Técnica 04). Lembrete de unidades: 1 mUI/mL = 1 UI/L.'},
 21:{q:'E se o β-hCG for de 500 mUI/mL? Podemos excluir gravidez ectópica?',a:'Também não. Uma gravidez ectópica pode existir com concentrações baixas de β-hCG, e a ruptura pode ocorrer mesmo com valores relativamente baixos ou em declínio.'},
 22:{q:'O β-hCG está caindo. A paciente está automaticamente fora de perigo?',a:'Não. O declínio hormonal não exclui imediatamente a possibilidade de ruptura de uma gravidez ectópica ainda presente.'},
 23:{q:'O ultrassom mostrou útero vazio. Qual é o diagnóstico?',a:'Ainda não é possível determinar apenas com esse achado. Pode se tratar de gestação intrauterina muito inicial, gestação em regressão ou gravidez ectópica.'},
 24:{q:'O que é o anel tubário?',a:'É uma imagem anexial sugestiva de saco gestacional ectópico, frequentemente caracterizada por uma estrutura anelar ecogênica fora da cavidade uterina.',
    trap:'Não deve ser confundido automaticamente com o corpo lúteo ovariano.',
    add:'NICE NG126 (rec. 1.4.18): massa anexial que se move separadamente do ovário (“sliding sign”) com saco gestacional vazio (“anel tubário”/“bagel sign”) indica alta probabilidade de ectópica tubária — integrar com clínica e hCG antes de fechar o diagnóstico.'},
 25:{q:'β-hCG de 2.500 e útero vazio: posso administrar metotrexato imediatamente?',a:'Não com base apenas nesses dois dados. É necessário confirmar adequadamente o diagnóstico, excluir uma gestação intrauterina viável e avaliar critérios clínicos, ultrassonográficos e laboratoriais.',
    deep:'A NICE recomenda que o metotrexato não seja oferecido na primeira avaliação sem diagnóstico definitivo de ectópica e exclusão de gestação intrauterina viável.'},
 26:{q:'Uma paciente com PUL deve receber metotrexato automaticamente?',a:'Não. É necessário acompanhamento estruturado, geralmente com avaliação clínica, β-hCG seriado e nova ultrassonografia conforme a evolução.',
    deep:'A intensidade dos sintomas e a estabilidade hemodinâmica têm prioridade sobre interpretações isoladas do β-hCG.'},
 27:{q:'Qual é a classificação inicial?',a:'Gestação de localização desconhecida.'},
 28:{q:'É correto afirmar que ela tem gravidez ectópica?',a:'Não. A localização ainda não foi determinada.'},
 29:{q:'Qual é a lógica do acompanhamento?',a:'Avaliar a evolução clínica e trofoblástica, repetir o β-hCG no intervalo apropriado e realizar nova ultrassonografia conforme a evolução, mantendo orientações claras para retorno imediato se surgirem sintomas de alarme.',
    add:'NICE NG126 (rec. 1.4.27–1.4.31): duas dosagens o mais próximo possível de 48 h (nunca antes); aumento > 63% → provável GIU em desenvolvimento (sem excluir ectópica), USTV em 7–14 dias; queda > 50% → provável regressão, teste urinário em 14 dias; padrões intermediários → revisão clínica em 24 h.'},
 30:{q:'Por que uma gravidez ectópica pode regredir espontaneamente?',a:'Porque o tecido trofoblástico pode perder sua capacidade de proliferação, levando à involução gestacional e à redução progressiva da produção de hCG.'},
 31:{q:'Se o β-hCG está caindo, por que ainda precisamos acompanhar?',a:'Porque o risco de sangramento e ruptura não desaparece imediatamente. É necessário confirmar a resolução e acompanhar os sintomas.',
    add:'NICE NG126 (rec. 1.6.5), conduta expectante: repetir hCG nos dias 2, 4 e 7; se cair ≥ 15% a cada medida, seguir semanalmente até negativar (< 20 UI/L); se não cair 15%, estabilizar ou subir, reavaliar com equipe sênior.'},
 32:{q:'Por que o metotrexato não é a escolha para uma paciente com choque hemorrágico?',a:'Porque ele não controla imediatamente uma hemorragia ativa. A paciente necessita de ressuscitação e controle urgente da fonte do sangramento.'},
 33:{q:'O metotrexato faz o β-hCG cair obrigatoriamente no dia seguinte?',a:'Não. No protocolo de dose única, a avaliação da resposta utiliza habitualmente dosagens nos dias 4 e 7. Pode haver elevação inicial do β-hCG.',
    deep:'Uma queda de pelo menos 15% entre os dias 4 e 7 é um parâmetro frequentemente utilizado para avaliar resposta. Depois, mantém-se acompanhamento semanal até a resolução.'},
 34:{q:'Por que uma paciente tratada com metotrexato ainda pode apresentar ruptura tubária?',a:'Porque a regressão do tecido gestacional não ocorre instantaneamente. A lesão tubária e o risco hemorrágico podem persistir durante o tratamento.'},
 35:{q:'Qual é a principal preocupação após uma salpingostomia?',a:'A persistência de tecido trofoblástico, que pode exigir acompanhamento do β-hCG e, em alguns casos, tratamento adicional.',
    add:'NICE NG126 (rec. 1.6.17–1.6.18): até 1 em cada 5 mulheres pode precisar de tratamento adicional (metotrexato e/ou salpingectomia); hCG 7 dias após a cirurgia e depois semanal até negativar.'},
 36:{q:'Uma paciente submetida à salpingectomia unilateral pode engravidar naturalmente?',a:'Sim, desde que existam condições reprodutivas favoráveis, especialmente função adequada da tuba contralateral.'},
 37:{q:'Qual é a síndrome hemodinâmica mais provável?',a:'Choque hemorrágico por provável sangramento intra-abdominal.'},
 38:{q:'Qual mecanismo explica a taquicardia?',a:'Ativação simpática compensatória diante da redução do volume circulante e do retorno venoso.'},
 39:{q:'Devemos aguardar o β-hCG quantitativo para decidir se a paciente precisa de intervenção?',a:'Não. A paciente apresenta sinais de instabilidade e suspeita de hemorragia intra-abdominal. A ressuscitação, a avaliação ginecológica/cirúrgica imediata e o controle da fonte hemorrágica não devem ser atrasados por exames complementares.'},
 40:{q:'Qual é o princípio terapêutico central?',a:'Controle urgente da hemorragia, acompanhado de ressuscitação hemodinâmica e suporte apropriado.',
    deep:'A ACOG considera a gravidez ectópica tubária com instabilidade hemodinâmica uma emergência que exige intervenção cirúrgica imediata.'},

 /* Revisão final — enunciados do roteiro; respostas-modelo construídas a partir do próprio roteiro (identificadas) */
 R1:{label:'Revisão · R1',q:'Por que a fecundação ocorre habitualmente na ampola, mas a implantação deve acontecer no útero?',model:true,
    a:'A ampola oferece o ambiente do encontro dos gametas (transporte espermático, capacitação, fluido tubário, tempo de permanência). Mas o embrião ainda não está pronto para implantar: ele se divide enquanto é transportado, e só como blastocisto (por volta dos dias 6–7) encontra o endométrio decidualizado, preparado para receber e regular a invasão trofoblástica. A tuba não tem decidualização equivalente nem parede capaz de acomodar a gestação. A-T-U: ampola fecunda, tuba transporta, útero implanta.'},
 R2:{label:'Revisão · R2',q:'Por que uma salpingite antiga pode aumentar o risco de gravidez ectópica?',model:true,
    a:'A infecção pode deixar lesão epitelial, perda de células ciliadas, fibrose e aderências que persistem após a resolução microbiológica. Uma lesão parcial permite a fecundação, mas retarda o transporte — o embrião “perde o Uber” e atinge a fase de implantação ainda na tuba. Tratar a infecção não devolve necessariamente a função tubária.'},
 R3:{label:'Revisão · R3',q:'Por que a gravidez ectópica produz β-hCG?',model:true,
    a:'Porque possui tecido trofoblástico funcional: o sinciciotrofoblasto produz hCG independentemente do local de implantação. O teste detecta o hormônio, não o endereço da gestação — o GPS está desligado.'},
 R4:{label:'Revisão · R4',q:'Por que a paciente pode apresentar dor no ombro?',model:true,
    a:'O sangue intraperitoneal irrita o peritônio diafragmático. As aferências seguem pelo nervo frênico (raízes C3–C5), segmentos que também recebem a sensibilidade da região do ombro; o cérebro projeta a dor no ombro — dor referida. Não é específica, mas no contexto certo eleva a suspeita de hemoperitônio.'},
 R5:{label:'Revisão · R5',q:'Por que a pressão arterial pode estar normal no início da hemorragia?',model:true,
    a:'A ativação simpática eleva a frequência cardíaca e a resistência vascular sistêmica, compensando a queda do volume sistólico (DC = FC × VS) e sustentando temporariamente a pressão. O pulso grita antes de a pressão cair; pressão normal não exclui perda sanguínea importante nem hipoperfusão.'},
 R6:{label:'Revisão · R6',q:'Por que o útero vazio no ultrassom não confirma gravidez ectópica?',model:true,
    a:'Porque útero vazio é compatível com gestação intrauterina muito inicial, gestação em regressão ou ectópica. Casa vazia não prova morador no vizinho: é preciso procurar a imagem anexial, integrar a clínica e a evolução do β-hCG — e, sem localização, classificar como PUL.'},
 R7:{label:'Revisão · R7',q:'Por que metotrexato não substitui cirurgia em uma paciente instável?',model:true,
    a:'Porque o metotrexato inibe a diidrofolato redutase e a proliferação trofoblástica — um efeito que se instala ao longo de dias e não fecha o vaso que está sangrando. A paciente instável precisa de ressuscitação e controle cirúrgico imediato da fonte hemorrágica. Instabilidade não espera.'}
};

Object.assign(QS,{

 E6a:{label:'Evocação · Bloco 6',nova:true,q:'Qual enzima o metotrexato inibe e qual a consequência?',a:'A diidrofolato redutase (DHFR): compromete a regeneração do tetraidrofolato e a síntese de nucleotídeos necessários à replicação celular — o trofoblasto, tecido proliferativo, é o alvo.'},
 E6b:{label:'Evocação · Bloco 6',nova:true,q:'Salpingectomia × salpingostomia: o que cada uma faz?',a:'Salpingectomia retira a tuba comprometida. Salpingostomia abre a tuba para remover o tecido gestacional, preservando a estrutura tubária (com risco de persistência trofoblástica).'}

/* ---------- helpers de marcação (usados nos slides) ---------- */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function Q(id, opt){
  opt = opt||{};
  const o = QS[id];
  const label = o.label || ('Pergunta ' + id);
  return `<div class="q${opt.step?' step':''}" data-qid="${id}">
    <div class="ql">${esc(label)}${(opt.nova||o.nova)?'<span class="new">nova · complementar</span>':''}</div>
    <div class="qt">${o.q}</div>
    <div class="btns">
      <button class="bt pri" data-act="ans" data-q="${id}">Revelar resposta</button>
      ${o.deep?`<button class="bt blu" data-act="deep" data-q="${id}" hidden>Aprofundamento</button>`:''}
      ${o.trap?`<button class="bt amb" data-act="trap" data-q="${id}" hidden>Pegadinha</button>`:''}
      ${o.add?`<button class="bt" data-act="add" data-q="${id}" hidden>Diretriz</button>`:''}
    </div>
    <div class="ans" data-slot="ans" hidden><span class="al">Resposta${o.model?' · resposta-modelo construída a partir do roteiro':''}</span>${o.a}</div>
    ${o.deep?`<div class="ans deep" data-slot="deep" hidden><span class="al">Aprofundamento</span>${o.deep}</div>`:''}
    ${o.trap?`<div class="ans trap" data-slot="trap" hidden><span class="al">Pegadinha</span>${o.trap}</div>`:''}
    ${o.add?`<div class="ans add" data-slot="add" hidden><span class="al">Acréscimo · referência de diretriz</span>${o.add}</div>`:''}
  </div>`;
}
function T(n, opt){
  opt = opt||{};
  const t = TEC[n];
  return `<div class="tec${opt.step?' step':''}" data-tec="${n}">
    <div class="tn">Técnica ${String(n).padStart(2,'0')} · ${t.nome.replace(/β-hCG/g,'<span class="nt">β-hCG</span>')}</div>
    <div class="tp">${t.frase}</div>
    ${opt.sci===false?'':`<div class="ts">${t.ciencia}</div>`}
  </div>`;
}
/* fluxograma progressivo: items = [texto | {t, s, c}] */
let _fid = 0;
function FLOW(items, opt){
  opt = opt||{};
  const id = 'f' + (++_fid);
  const nodes = items.map((it,i)=>{
    const o = typeof it==='string'?{t:it}:it;
    return `${i?`<div class="fa fw" data-i="${i}">${opt.h?'→':'↓'}</div>`:''}<div class="fn fw ${o.c||''}" data-i="${i}">${o.t}${o.s?`<small>${o.s}</small>`:''}</div>`;
  }).join('');
  return `<div class="flowbox${opt.step?' step':''}" data-flow="${id}">
    ${opt.title?`<h3>${opt.title}</h3>`:''}
    <div class="flow${opt.h?' h':''}">${nodes}</div>
    <div class="btns flowctl"><button class="bt pri" data-act="fnext" data-f="${id}">Revelar próxima etapa</button><button class="bt" data-act="fall" data-f="${id}">Mostrar todas</button><button class="bt" data-act="freset" data-f="${id}">Recomeçar</button></div>
  </div>`;
}
const S = (html, cls) => `<div class="step ${cls||''}">${html}</div>`;
const CARD = (cls, title, html) => `<div class="card ${cls||''}">${title?`<h3>${title}</h3>`:''}${html}</div>`;

  explain:`<p><b>Fala sugerida:</b> “Hoje nós vamos estudar uma doença potencialmente fatal, mas não vamos começar pela doença. Vamos começar pela normalidade. Porque, para compreender a gravidez ectópica, primeiro precisamos entender como o embrião chega ao útero.</p>

  explain:`<p><b>As quatro regiões:</b> Infundíbulo · Ampola · Istmo · Porção intramural. Sentido do transporte em direção à cavidade uterina.</p>

 prof:{show:'Três camadas; mensagem do transporte integrado.',
  explain:`<p>A parede da tuba apresenta três componentes fundamentais: mucosa, camada muscular e serosa.</p>
  <p>A mucosa possui epitélio colunar simples com células ciliadas e células secretoras.</p>
  <p>As células ciliadas contribuem para o deslocamento do conteúdo tubário em direção ao útero. As células secretoras produzem substâncias que ajudam a manter o microambiente necessário à sobrevivência dos gametas e ao desenvolvimento embrionário inicial.</p>
  <p>A camada muscular lisa apresenta contrações que também participam do transporte. Esse processo é modulado por hormônios, mediadores locais e mecanismos neuromusculares.</p>
  <p>A serosa reveste externamente a tuba, que mantém relação anatômica com o mesossalpinge e seus vasos.</p>
  <p>É importante explicar que o transporte tubário resulta de mecanismos integrados. Não depende exclusivamente dos cílios, nem exclusivamente da contração muscular.</p>`,
  trap:'Atribuir o transporte apenas aos cílios.'}

 ${S(FLOW([{t:'Sincronização falha',c:'amber'},{t:'Embrião permanece na tuba',c:'amber'},{t:'Implantação em tecido que não foi preparado para sustentar a gestação',c:'red'}]))}`,

add({b:2,k:'2.2 · O blastocisto',t:'Massa celular interna × trofectoderma',
 body:`<div class="grid g2">
 ${CARD('blue','Massa celular interna','<p>Dará origem ao <b>embrião propriamente dito</b>.</p>')}
 ${CARD('teal','Trofectoderma (camada externa)','<p>Participa da formação do <b>trofoblasto</b> e de estruturas placentárias.</p>')}
 </div>
 ${S(`<h2>Na implantação, o trofoblasto se diferencia</h2><div class="grid g2">
 ${CARD('teal','Citotrofoblasto','<p>Mantém <b>atividade proliferativa</b> e fornece células para diferentes linhagens trofoblásticas.</p>')}
 ${CARD('amber','Sinciciotrofoblasto','<p>Atividade <b>invasiva</b>, participa da implantação e <b>produz hCG</b>.</p>')}</div>`)}
 ${S('<div class="callout green big">A invasão trofoblástica não é, por si só, patológica. Ela é indispensável para a placenta. O problema é o <u>lugar</u>.</div>')}`,
 sc:[2,3],
 img:{tema:'Blastocisto e diferenciação trofoblástica',pos:'Entre os dois pares de cartões',conceito:'Massa celular interna, trofectoderma, citotrofoblasto e sinciciotrofoblasto.',src:''},
 prof:{show:'Estruturas do blastocisto; cito × sinciciotrofoblasto; invasão é fisiológica.',
  explain:`<p>O blastocisto apresenta uma massa celular interna, que dará origem ao embrião propriamente dito, e uma camada externa, o trofectoderma, que participa da formação do trofoblasto e de estruturas placentárias.</p>
  <p>Durante a implantação, o trofoblasto diferencia-se em citotrofoblasto e sinciciotrofoblasto.</p>
  <p>O citotrofoblasto mantém atividade proliferativa e fornece células para diferentes linhagens trofoblásticas.</p>
  <p>O sinciciotrofoblasto apresenta atividade invasiva, participa da implantação e produz hCG.</p>
  <p>Explique que a invasão trofoblástica não é, por si só, patológica. Ela é indispensável para o desenvolvimento da placenta.</p>
  <p>O problema surge quando esse processo acontece em um local anatomicamente inadequado.</p>`}
});

add({b:2,k:'2.2 · Pergunta',t:'O trofoblasto é agressivo?',
 body:`${Q(4)}${S(T(3))}`,
 sc:[2,3],
 prof:{show:'Pergunta 4 com a analogia; Técnica 03.',
  explain:`<p><b>Resposta comentada:</b> Ele possui capacidade fisiológica de adesão, invasão e remodelamento tecidual. Essa capacidade é regulada por mecanismos moleculares e pela interação com os tecidos maternos.</p>
  <p>É possível utilizar uma analogia: “O trofoblasto é uma equipe de construção especializada em estabelecer a interface materno-embrionária. No endométrio, encontra um ambiente biologicamente preparado. Na tuba, a mesma atividade invasiva pode lesar estruturas que não oferecem condições equivalentes de acomodação.”</p>`,
  tip:'Técnica 03 — O trofoblasto é um pedreiro no endereço errado: “No útero, constrói a placenta. Na tuba, pode destruir vasos.”'}
});

add({b:2,k:'2.3 · Decidualização',t:'O útero prepara o canteiro de obras',
 body:`<div class="callout teal"><p>Transformação funcional das <b>células estromais endometriais</b>, sob influência principalmente da <b>progesterona</b>, com participação de mediadores locais.</p></div>
 ${S(`<div class="grid g4">${CARD('','Matriz extracelular','<p>alterada</p>')}${CARD('','Vascularização','<p>alterada</p>')}${CARD('','Atividade imunológica','<p>alterada</p>')}${CARD('','Secreção','<p>alterada</p>')}</div>
 <div class="callout green"><b>Resultado:</b> receptividade uterina + <b>controle</b> da invasão trofoblástica.</div>`)}
 ${S('<div class="callout red"><b>A tuba não possui decidualização fisiológica equivalente.</b> Arquitetura diferente, menor capacidade de acomodar a expansão gestacional e a invasão placentária.</div>')}`,
 sc:[2],
 prof:{show:'Definição, quatro alterações, resultado e contraste com a tuba.',
  explain:`<p>A decidualização corresponde à transformação funcional das células estromais endometriais, sob influência principalmente da progesterona, com participação de mediadores locais.</p>
  <p>Esse processo altera a matriz extracelular, a vascularização, a atividade imunológica e as características secretoras do endométrio.</p>
  <p>A decidualização contribui para a receptividade uterina e para o controle da invasão trofoblástica.</p>
  <p>A tuba não possui uma decidualização fisiológica equivalente à do endométrio uterino. Sua parede apresenta arquitetura diferente, com menor capacidade de acomodar a expansão gestacional e a invasão placentária.</p>`}
});

add({b:2,k:'2.4 · Endocrinologia',t:'Por que o hCG aumenta?',
 body:`${FLOW([{t:'Sinciciotrofoblasto',s:'produz hCG',c:'amber'},{t:'hCG mantém o corpo lúteo',s:'função inicial mais conhecida',c:'blue'},{t:'Corpo lúteo continua produzindo progesterona',s:'nas primeiras semanas',c:'blue'},{t:'Progesterona',s:'mantém o endométrio e reduz a contratilidade uterina',c:'teal'}])}
 ${S('<div class="callout amber big">Uma gravidez ectópica pode produzir hCG porque possui tecido trofoblástico funcional — apesar da implantação inadequada.</div>')}`,
 sc:[2,5],
 prof:{show:'Cascata hCG → corpo lúteo → progesterona; conclusão.',
  explain:`<p>O hCG é produzido principalmente pelo sinciciotrofoblasto.</p>
  <p>Sua função inicial mais conhecida é manter o corpo lúteo, que continua produzindo progesterona durante as primeiras semanas de gestação.</p>
  <p>A progesterona mantém o endométrio em condições adequadas e reduz a contratilidade uterina.</p>
  <p>Portanto, uma gravidez ectópica pode produzir hCG porque possui tecido trofoblástico funcional, apesar da implantação inadequada.</p>`}
});

add({b:4,k:'4.1 · Fisiopatologia',t:'Por que a tuba não consegue sustentar a gestação?',
 body:`<div class="grid g3">${CARD('blue','Parede delgada','')}${CARD('blue','Mucosa complexa','')}${CARD('blue','Capacidade limitada de crescer','')}</div>
 ${S(FLOW([{t:'Invasão trofoblástica',s:'compromete vasos e estruturas da parede',c:'amber'},{t:'Distensão',c:'amber'},{t:'Sangramento intratubário',c:'red'},{t:'Aborto tubário ou ruptura',c:'red'}],{title:'À medida que a gestação evolui'}))}
 ${S('<div class="callout red big">Nem toda hemorragia de ectópica exige ruptura completa da tuba.</div><p>O sangramento também pode ocorrer por <b>separação parcial</b> do tecido gestacional, <b>erosão vascular</b> e <b>eliminação do conteúdo pela extremidade fimbrial</b>.</p>')}

 sc:[3,4],
 img:{tema:'Ectópica ampular: distensão, aborto tubário e ruptura',pos:'Ao lado do fluxograma',conceito:'Mecanismos de hemorragia com e sem ruptura completa.',src:''},
 prof:{show:'Limitações da tuba; fluxo da evolução; hemorragia sem ruptura; Técnica 03.',
  explain:`<p>A tuba possui parede relativamente delgada, arquitetura mucosa complexa e capacidade limitada de acomodar o crescimento gestacional.</p>

add({b:4,k:'4.3 · Sangramento vaginal',t:'Sangue pela vagina não prova endereço uterino',
 body:`${FLOW([{t:'Ectópica produz hCG',s:'mantém temporariamente corpo lúteo e progesterona',c:'blue'},{t:'Alterações na evolução gestacional e na sustentação hormonal',c:'amber'},{t:'Instabilidade e descamação decidual do endométrio uterino',c:'amber'},{t:'Sangramento vaginal — sem embrião na cavidade',c:'red'}])}
 ${S(Q(13))}`,
 sc:[4],
 prof:{show:'Mecanismo do sangramento vaginal; Pergunta 13.',
  explain:`<p>A gestação ectópica pode produzir hCG e manter temporariamente o corpo lúteo e a produção de progesterona.</p>
  <p>Entretanto, alterações na evolução gestacional e na sustentação hormonal podem levar à instabilidade e descamação decidual do endométrio uterino.</p>
  <p>Assim, pode ocorrer sangramento vaginal mesmo sem implantação do embrião na cavidade uterina.</p>`,
  trap:'Interpretar sangramento vaginal como sinal de gestação intrauterina (ou de “abortamento”) sem localizar a gestação.'}
});

add({b:4,k:'4.4 · Choque hemorrágico',t:'Construindo a sequência fisiológica',
 body:`${FLOW([{t:'Lesão vascular → sangramento intraperitoneal',c:'red'},{t:'↓ volume circulante efetivo',c:'red'},{t:'↓ retorno venoso',c:'amber'},{t:'↓ pré-carga ventricular',c:'amber'},{t:'↓ volume sistólico',c:'amber'},{t:'Débito cardíaco insuficiente',c:'amber'},{t:'↓ oferta de O₂ aos tecidos',c:'red'},{t:'Hipoperfusão · acidose metabólica · disfunção orgânica',s:'conforme intensidade e duração da hemorragia',c:'red'}])}
 ${S('<div class="card amber"><p class="big mono" style="text-align:center">DC = FC × VS</p><p class="mut" style="text-align:center">débito cardíaco = frequência cardíaca × volume sistólico</p></div>')}
 ${S('<div class="callout amber">No início, a <b>ativação simpática</b> eleva a FC e a resistência vascular sistêmica, mantendo temporariamente a pressão. <b>Pressão aparentemente normal não exclui perda sanguínea importante.</b></div>')}`,
 sc:[4],
 prof:{show:'Cascata progressiva; DC = FC × VS; compensação simpática.',
  explain:`<p>Construa a sequência fisiológica:</p>
  <ul><li>A lesão vascular produz sangramento intraperitoneal.</li><li>A perda de sangue reduz o volume circulante efetivo.</li><li>O retorno venoso diminui.</li><li>A pré-carga ventricular pode cair.</li><li>O volume sistólico diminui.</li><li>O débito cardíaco torna-se insuficiente.</li><li>A oferta de oxigênio aos tecidos diminui.</li><li>Surgem hipoperfusão, acidose metabólica e disfunção orgânica, dependendo da intensidade e duração da hemorragia.</li></ul>
  <p>Apresente a relação DC = FC × VS, em que DC é o débito cardíaco, FC é a frequência cardíaca e VS é o volume sistólico.</p>
  <p>No início da hemorragia, a ativação simpática pode elevar a frequência cardíaca e a resistência vascular sistêmica, mantendo temporariamente a pressão arterial.</p>
  <p>Portanto, uma pressão arterial aparentemente normal não exclui perda sanguínea importante.</p>`}
});

  explain:'<p>Perguntas 14 e 15 conforme o roteiro.</p>',
  deep:'<b>Simulador (acréscimo didático, identificado):</b> ilustra qualitativamente a sequência das classes de choque hemorrágico do ATLS — a FC sobe antes de a PA cair. Os percentuais de perda por classe são referência clássica do ATLS; conferir a edição vigente. Não use o simulador para estimar perda real.',
  trap:'“PA normal = paciente estável.” Também: nem toda hemorragia produz taquicardia (p. ex., betabloqueio; bradicardia relativa por reflexo vagal no hemoperitônio é descrita).',
  tip:'Técnica 07 — “O pulso GRITA antes de a pressão CAIR.” Ressalte: nem toda hemorragia produz taquicardia e pressão normal não exclui hipoperfusão.'}
});

add({b:5,k:'5.1 · Caso de abertura',t:'O primeiro passo não é o ultrassom',
 body:`<div data-widget="case" data-case="c1"></div>
 ${S(`<h2>Qual é o primeiro diagnóstico que vocês precisam considerar?</h2><div class="chips"><span class="chip">Apendicite</span><span class="chip">Cisto ovariano</span><span class="chip">Abortamento</span><span class="chip on">Gravidez ectópica</span><span class="chip">Infecção urinária</span></div>
 <div class="callout amber">Todas são possíveis — mas <b>dor abdominal em mulher com possibilidade de gravidez exige investigação gestacional</b>.</div>`)}
 ${S('<div class="callout red big">Antes de discutir β-hCG: a paciente está estável?</div><p>Síncope, hipotensão, sinais de hipoperfusão ou irritação peritoneal importante podem exigir abordagem <b>emergencial</b>.</p>')}`,
 sc:[5],
 prof:{show:'Caso revelado dado a dado; hipóteses; estabilidade primeiro.',
  explain:`<p>Este é o bloco em que mais se deve estimular a participação dos alunos. A ideia é fazer com que cada exame tenha uma justificativa fisiológica e uma limitação claramente compreendida.</p>
  <p><b>Fala sugerida:</b> “Uma paciente de 27 anos chega à emergência com dor em fossa ilíaca direita, atraso menstrual de seis semanas e pequeno sangramento vaginal. Qual é o primeiro diagnóstico que vocês precisam considerar?”</p>
  <p>Permita que respondam: apendicite, cisto ovariano, abortamento, gravidez ectópica, infecção urinária.</p>
  <p>Todas são hipóteses possíveis, mas a presença de dor abdominal em uma mulher com possibilidade de gravidez exige investigação gestacional.</p>
  <p>Antes de discutir valores de β-hCG, deve-se avaliar a estabilidade hemodinâmica.</p>
  <p>Uma paciente com síncope, hipotensão, sinais de hipoperfusão ou irritação peritoneal importante pode necessitar de abordagem emergencial.</p>`}
});

add({b:5,k:'5.2 · Apresentação clínica',t:'A tríade clássica é referência, não exigência',
 body:`<div class="grid g3">${CARD('blue','Amenorreia','')}${CARD('amber','Dor abdominal ou pélvica','')}${CARD('red','Sangramento vaginal','')}</div>
 ${S('<div class="callout amber">Nem todas têm os três. Algumas têm dor discreta. Outras, apenas sangramento. Algumas chegam com <b>síncope ou choque</b>.</div>')}
 ${S(Q(18))}${S(Q(19))}`,
 sc:[5],
 prof:{show:'Tríade; variabilidade; Perguntas 18 e 19.',
  explain:`<p>A apresentação tradicional envolve amenorreia, dor abdominal ou pélvica e sangramento vaginal.</p>
  <p>Entretanto, nem todas as pacientes apresentam os três elementos.</p>
  <p>Algumas podem ter dor discreta. Outras apresentam apenas sangramento. Algumas chegam com síncope ou sinais de choque.</p>
  <p>Portanto, a tríade é uma referência didática, não uma exigência diagnóstica.</p>`,
  deep:'NICE NG126 (rec. 1.3.2): a apresentação atípica de ectópica é comum. Outros sintomas relatados: sensibilidade mamária, sintomas gastrointestinais, tontura/síncope, dor no ombro, sintomas urinários, eliminação de tecido, pressão retal ou dor à evacuação.'}
});

add({b:5,k:'5.3 · β-hCG',t:'O que o β-hCG realmente informa?',
 body:`<div class="grid g2">${CARD('teal','Glicoproteína','<p>Produzida predominantemente pelo <b>sinciciotrofoblasto</b>.</p>')}${CARD('blue','Duas subunidades','<p><b>α</b>: compartilhada com outros hormônios glicoproteicos.<br><b>β</b>: maior especificidade analítica.</p>')}</div>
 ${S('<p>O β-hCG sérico <b>quantitativo</b> permite avaliar a <b>evolução</b> da atividade trofoblástica.</p>')}
 ${S(`<h2>Separe três conceitos</h2><div class="grid g3">${CARD('green','1 · Presença','<p>de atividade trofoblástica</p><p class="c-green"><b>β-hCG ajuda</b></p>')}${CARD('green','2 · Evolução','<p>da gestação</p><p class="c-green"><b>β-hCG ajuda</b></p>')}${CARD('red','3 · Localização','<p>da gestação</p><p class="c-red"><b>β-hCG não determina sozinho</b></p>')}</div>`)}
 ${S(T(4))}`,
 sc:[5],
 prof:{show:'Bioquímica do hCG; três conceitos; Técnica 04.',
  explain:`<p>A gonadotrofina coriônica humana é uma glicoproteína produzida predominantemente pelo sinciciotrofoblasto.</p>
  <p>Possui duas subunidades, alfa e beta. A subunidade alfa compartilha características com outros hormônios glicoproteicos, enquanto a beta oferece maior especificidade analítica.</p>
  <p>O β-hCG sérico quantitativo permite avaliar a evolução da atividade trofoblástica.</p>
  <p>Mas precisamos separar três conceitos: presença de atividade trofoblástica; evolução da gestação; localização da gestação.</p>
  <p>O β-hCG auxilia principalmente nos dois primeiros. Não determina sozinho o terceiro.</p>`,
  deep:'NICE NG126 (rec. 1.4.24 e 1.4.26): não usar hCG sérico para determinar a localização; usá-lo apenas para avaliar a proliferação trofoblástica e orientar a conduta.',
  tip:'Técnica 04 — “β-hCG POSITIVO? Existe sinal trofoblástico. Mas CADÊ a gestação?”'}
});

add({b:5,k:'5.4 · Cinética',t:'“Dobrar em 48 horas” é uma simplificação inadequada',
 body:`<div class="callout amber"><p>Historicamente: o β-hCG “deveria dobrar a cada 48 h” numa gestação intrauterina viável. <b>Essa simplificação não é adequada.</b></p></div>
 ${S('<p>O aumento mínimo esperado <b>depende da concentração inicial</b>, e uma GIU viável pode crescer <b>menos de 100%</b> em 48 h.</p>')}
 ${S(`<div class="grid g2">${CARD('blue','Estudos de GIU viáveis','<p>Aumentos mínimos aproximados de <b>49%, 40% e 33%</b> em 48 h para faixas iniciais <b>crescentes</b> de β-hCG.</p><p class="mut">Referências estatísticas — não testes isolados de viabilidade ou localização.</p>')}
 ${CARD('teal','NICE · PUL','<p><b>Aumento &gt; 63%</b> em 48 h: sugestivo de GIU em desenvolvimento — <b>sem excluir</b> ectópica.</p><p><b>Queda &gt; 50%</b>: sugere gestação em regressão — exige acompanhamento.</p>')}</div>`)}
 ${S('<div class="callout red">Esses valores vêm de abordagens diferentes e <b>não são limiares intercambiáveis</b>.</div>')}`,
 sc:[5],
 prof:{show:'Mito do “dobrar”; dois referenciais distintos; aviso de não intercambialidade.',
  explain:`<p>Historicamente, ensinava-se que o β-hCG deveria dobrar a cada 48 horas em uma gestação intrauterina viável.</p>
  <p>Essa simplificação não é adequada.</p>
  <p>O aumento mínimo esperado depende, entre outros fatores, da concentração inicial, e uma gestação intrauterina viável pode apresentar crescimento inferior a 100% em 48 horas.</p>
  <p>Em estudos de gestações intrauterinas viáveis, foram descritos aumentos mínimos aproximados de 49%, 40% e 33% em 48 horas para faixas iniciais crescentes de β-hCG. Esses números são referências estatísticas, não testes isolados de viabilidade ou localização.</p>
  <p>A NICE utiliza, para o acompanhamento de gestação de localização desconhecida, um aumento superior a 63% em 48 horas como padrão sugestivo de gestação intrauterina em desenvolvimento, sem excluir completamente gravidez ectópica. Uma queda superior a 50% sugere gestação em regressão, mas exige acompanhamento apropriado.</p>
  <p>É essencial explicar que esses valores vêm de abordagens diferentes e não devem ser tratados como limiares intercambiáveis.</p>`,
  deep:'As faixas iniciais usualmente associadas a 49% / 40% / 33% são < 1.500, 1.500–3.000 e > 3.000 mUI/mL (Barnhart e cols., Obstet Gynecol 2016, citado pela ACOG) — <b>conferir a fonte primária</b> antes de projetar os números de faixa.'}
});

add({b:5,k:'5.4 · Laboratório de β-hCG',t:'Calcule — e depois desconfie do cálculo',
 body:`<div data-widget="hcg"></div>`,
 sc:[5],
 prof:{show:'Calculadora com o exercício do quadro (1.000 → 1.600 em 48 h).',
  explain:`<p><b>Exercício no quadro:</b> Uma paciente apresenta β-hCG inicial de 1.000 mUI/mL e, 48 horas depois, 1.600 mUI/mL.</p>
  <p>Pergunte: “Qual foi o aumento percentual?” (1600 − 1000) / 1000 × 100 = 60%. <b>Resposta: aumento de 60%.</b></p>
  <p>Professor: “Esse crescimento confirma gestação intrauterina?” Resposta: Não.</p>
  <p>“Confirma gravidez ectópica?” Resposta: Também não.</p>
  <p>Ele demonstra crescimento da concentração hormonal, que precisa ser interpretado com os sintomas e os achados ultrassonográficos.</p>`,
  ask:'“Qual foi o aumento percentual?” → “Confirma GIU?” → “Confirma ectópica?”',
  answer:'60%. Não confirma GIU. Também não confirma ectópica.',
  trap:'Note que 60% fica ACIMA do mínimo de ~49% descrito para essa faixa, mas ABAIXO dos 63% da NICE: dois referenciais diferentes, conclusões diferentes — exatamente por isso não são intercambiáveis.'}
});

add({b:5,k:'5.5 · Ultrassonografia transvaginal',t:'Achado diagnóstico × achado sugestivo',
 body:`<p>O examinador procura: <b>sinais de gestação intrauterina</b> · <b>anexos</b> · <b>líquido livre</b>.</p>
 ${S(`<div class="grid g3">
 ${CARD('green','Evidência direta','<p>Massa anexial <b>separada do ovário</b> contendo saco gestacional com <b>vesícula vitelínica ou embrião</b>.</p>')}
 ${CARD('amber','Aumenta a suspeita','<p>Massa anexial complexa · <b>anel tubário</b> — exigem interpretação integrada.</p>')}
 ${CARD('red','Isoladamente não confirma','<p><b>Útero vazio.</b></p>')}</div>`)}
 ${S(T(5))}`,
 sc:[5],
 img:{tema:'USTV: saco gestacional anexial com vesícula vitelínica; anel tubário; útero vazio',pos:'Abaixo dos três cartões',conceito:'Gradação da força do achado ultrassonográfico.',src:''},
 prof:{show:'Gradação dos achados; Técnica 05.',
  explain:`<p>A ultrassonografia transvaginal é fundamental para investigar a localização da gestação.</p>
  <p>O examinador deve procurar sinais de gestação intrauterina, avaliar os anexos e verificar a presença de líquido livre.</p>
  <p>É importante distinguir achados diagnósticos de achados apenas sugestivos.</p>
  <p>A visualização de uma massa anexial separada do ovário, contendo saco gestacional com vesícula vitelínica ou embrião, oferece evidência direta de gravidez ectópica tubária.</p>
  <p>Uma massa anexial complexa ou o chamado anel tubário aumentam a suspeita, mas exigem interpretação integrada.</p>
  <p>O útero vazio, isoladamente, não confirma ectópica.</p>`,
  deep:'NICE NG126 (rec. 1.4.19–1.4.20): coleção líquida intracavitária (“pseudossaco”) deve ser diferenciada do saco intrauterino inicial (sinal do duplo anel decidual); líquido livre moderado a grande no fundo de saco pode representar hemoperitônio — integrar com clínica e hCG.',
  tip:'Técnica 05 — “CASA VAZIA não prova morador no vizinho.”'}
});

add({b:5,k:'5.6 · Zona discriminatória',t:'Uma faixa, não uma linha de corte universal',
 body:`<div class="callout blue"><p>Faixa de β-hCG <b>acima da qual se espera visualizar</b> sinais de gestação intrauterina pela USTV, em condições técnicas e clínicas adequadas.</p></div>
 ${S('<p class="big">≈ 1.500 a 3.500 mUI/mL <span class="mut" style="font-size:.6em">em diferentes abordagens</span></p><p><b>Não existe limite universal absolutamente seguro.</b></p>')}
 ${S('<div class="chips"><span class="chip on">Equipamento</span><span class="chip on">Experiência do examinador</span><span class="chip on">Idade gestacional real</span><span class="chip on">Outras circunstâncias</span></div>')}
 ${S('<div class="callout red big">Em gestação desejada, decisões irreversíveis não devem se basear só na ausência de saco intrauterino acima de um valor arbitrário.</div>')}
 ${S(Q(25))}`,
 sc:[5],
 prof:{show:'Definição, faixa, fatores, alerta; Pergunta 25.',
  explain:`<p>A zona discriminatória corresponde a uma faixa de β-hCG acima da qual se espera visualizar determinados sinais de gestação intrauterina pela ultrassonografia transvaginal, considerando condições técnicas e clínicas adequadas.</p>
  <p>Valores entre aproximadamente 1.500 e 3.500 mUI/mL aparecem em diferentes abordagens, mas não existe um limite universal absolutamente seguro.</p>
  <p>A interpretação depende do equipamento, da experiência do examinador, da idade gestacional real e de outras circunstâncias.</p>
  <p>Em uma gestação desejada, decisões irreversíveis não devem se basear exclusivamente na ausência de saco intrauterino acima de um valor arbitrário de β-hCG.</p>`,
  deep:'ACOG PB 193: se a zona discriminatória for usada como auxílio diagnóstico, o valor deve ser conservadoramente alto (p. ex., até 3.500 mUI/mL) para evitar interromper uma gestação intrauterina desejada.'}
});

add({b:5,k:'5.7 · Gestação de localização desconhecida',t:'PUL: uma classificação temporária',

 ${S('<p>Teste gestacional <b>positivo</b>, mas a USTV ainda <b>não identifica</b> gestação intrauterina nem extrauterina.</p>')}
 ${S(FLOW([{t:'PUL',c:'amber'},{t:'Gestação intrauterina confirmada',c:'green'},{t:'Gravidez ectópica diagnosticada',c:'red'},{t:'Gestação em regressão identificada',c:'blue'}],{title:'Para onde a PUL pode evoluir'}))}
 ${S(Q(26))}`,
 sc:[5],
 prof:{show:'Técnica 08; definição; desfechos possíveis; Pergunta 26.',
  explain:`<p>A expressão pregnancy of unknown location, ou PUL, descreve uma situação em que existe teste gestacional positivo, mas a ultrassonografia ainda não identifica uma gestação intrauterina ou extrauterina.</p>
  <p>PUL não é um diagnóstico anatômico definitivo. É uma classificação temporária.</p>
  <p>Ela pode evoluir para confirmação de gestação intrauterina, diagnóstico de ectópica ou identificação de gestação em regressão.</p>`,
  trap:'Tratar PUL como sinônimo de ectópica.',
  tip:'Técnica 08 — PUL: “Positivo, Ultrassom não Localizou.”'}
});

add({b:6,k:'6.1 · Tratamento',t:'Por que pacientes diferentes recebem tratamentos diferentes?',
 body:`<p class="lead">O objetivo não é um curso de cirurgia ginecológica. É mostrar que a escolha <b>deriva da fisiopatologia</b>, da <b>estabilidade hemodinâmica</b> e da <b>evolução gestacional</b>.</p>
 ${S(`<div class="grid g3">${CARD('blue','Conduta expectante','<p>observar</p>')}${CARD('teal','Tratamento medicamentoso','<p>metotrexato</p>')}${CARD('red','Cirurgia','<p>operar</p>')}</div>`)}
 ${S('<p>A seleção depende de características <b>clínicas, laboratoriais, ultrassonográficas</b>, da <b>possibilidade de seguimento</b> e das <b>preferências da paciente</b>.</p>')}
 ${S(T(9))}`,
 sc:[6],
 prof:{show:'Objetivo do bloco; três caminhos; critérios gerais; Técnica 09.',
  explain:`<p>Neste bloco, o objetivo não é transformar a aula de Morfofuncional em um curso de cirurgia ginecológica.</p>
  <p>O objetivo é demonstrar que a escolha terapêutica deriva da fisiopatologia, da estabilidade hemodinâmica e da evolução gestacional.</p>
  <p>Existem três estratégias gerais para a gravidez ectópica tubária: conduta expectante, tratamento medicamentoso e cirurgia.</p>
  <p>A seleção depende de características clínicas, laboratoriais, ultrassonográficas, da possibilidade de seguimento e das preferências da paciente.</p>`,
  tip:'Técnica 09 — “OBSERVAR se elegível, MEDICAR se elegível, OPERAR se necessário. Instabilidade não espera.” Não é protocolo absoluto.'}
});

add({b:6,k:'6.1 · Conduta expectante',t:'Observar não é mandar para casa e esperar',
 body:`<div class="callout blue"><p>Pacientes <b>criteriosamente selecionadas</b>: estáveis, sem dor significativa, gestação tubária pequena, sem atividade cardíaca embrionária, β-hCG baixo.</p></div>
 ${S('<div class="chips"><span class="chip on">Vigilância clínica</span><span class="chip on">Monitorização hormonal</span><span class="chip on">Acesso rápido à emergência</span></div>')}
 ${S(`<div class="card teal"><h3>Critérios NICE NG126</h3><ul class="clean"><li>Estável e <b>sem dor</b></li><li>Ectópica tubária <b>&lt; 35 mm</b>, sem batimentos cardíacos visíveis</li><li>β-hCG <b>≤ 1.000 UI/L</b> → pode ser <b>oferecida</b></li><li>β-hCG <b>1.000–1.500 UI/L</b> → pode ser <b>considerada</b> (demais condições iguais)</li><li>Possibilidade de <b>acompanhamento</b></li></ul></div>`)}
 ${S(Q(30))}${S(Q(31))}`,
 sc:[6],
 prof:{show:'Seleção, vigilância, critérios NICE; Perguntas 30 e 31.',
  explain:`<p>Pode ser considerada em pacientes criteriosamente selecionadas, clinicamente estáveis, sem dor significativa, com gestação tubária pequena, sem atividade cardíaca embrionária e com β-hCG baixo.</p>
  <p>Não significa simplesmente mandar a paciente para casa e esperar.</p>
  <p>Exige vigilância clínica, monitorização hormonal e acesso rápido ao atendimento de emergência.</p>
  <p>Pelos critérios da NICE, a conduta expectante pode ser oferecida a pacientes estáveis e sem dor, com ectópica tubária menor que 35 mm, sem batimentos cardíacos visíveis, β-hCG até 1.000 UI/L e possibilidade de acompanhamento. Pode ser considerada entre 1.000 e 1.500 UI/L nas demais condições especificadas.</p>`}
});

add({b:6,k:'6.2 · Metotrexato',t:'Atacar a proliferação, não o “endereço”',
 body:`${FLOW([{t:'Metotrexato',s:'antagonista do metabolismo do folato',c:'teal'},{t:'Inibe a diidrofolato redutase (DHFR)',c:'red'},{t:'Compromete a regeneração do tetraidrofolato',c:'amber'},{t:'↓ síntese de nucleotídeos para a replicação celular',c:'amber'},{t:'Trofoblasto proliferativo vira alvo terapêutico',c:'teal'}])}
 ${S('<blockquote>“Não estamos usando o metotrexato porque a gravidez está na tuba. Estamos usando um medicamento que interfere na proliferação de um tecido biologicamente ativo.”</blockquote>')}`,
 sc:[6],
 prof:{show:'Mecanismo em fluxograma; fala do professor.',
  explain:`<p>O metotrexato é um antagonista do metabolismo do folato.</p>
  <p>Seu mecanismo envolve a inibição da diidrofolato redutase, comprometendo a regeneração do tetraidrofolato e, consequentemente, a síntese de nucleotídeos necessários à replicação celular.</p>
  <p>Como o trofoblasto apresenta atividade proliferativa, torna-se um alvo terapêutico.</p>
  <p><b>Fala sugerida:</b> “Observem que não estamos utilizando o metotrexato porque a gravidez está na tuba especificamente. Estamos utilizando um medicamento que interfere na proliferação de um tecido biologicamente ativo. A localização e a condição clínica é que determinam se essa estratégia é apropriada.”</p>`}
});

add({b:6,k:'6.2 · Metotrexato',t:'Quem pode receber — e quem não pode',
 body:`<div class="grid g2">
 ${CARD('green','Pacientes selecionadas','<ul class="clean"><li>Diagnóstico <b>confirmado</b></li><li><b>Estabilidade</b> hemodinâmica</li><li>Ausência de contraindicações</li><li>Possibilidade de <b>acompanhamento</b></li></ul>')}
 ${S(CARD('red','Contraindicações relevantes','<ul class="clean"><li>Disfunção hepática, renal ou hematológica importante</li><li>Certas condições de imunossupressão</li><li>Amamentação</li><li>Impossibilidade de seguimento</li></ul>'))}
 </div>
 ${S('<div class="callout amber">Antes: <b>hemograma, função renal e hepática</b>; revisar medicamentos e condições que aumentem a toxicidade.</div>')}
 ${S(Q(32))}${S(Q(33))}${S(Q(34))}`,
 sc:[6],
 prof:{show:'Seleção, contraindicações, exames; Perguntas 32–34.',
  explain:`<p>O metotrexato sistêmico pode ser utilizado em pacientes selecionadas, com diagnóstico confirmado, estabilidade hemodinâmica, ausência de contraindicações e possibilidade de acompanhamento.</p>
  <p>Entre as contraindicações relevantes estão disfunções hepáticas, renais ou hematológicas importantes, determinadas condições de imunossupressão, amamentação e impossibilidade de seguimento.</p>
  <p>É necessário verificar hemograma e funções renal e hepática, além de revisar medicamentos e condições clínicas que possam aumentar sua toxicidade.</p>`,
  deep:'NICE NG126 (rec. 1.6.8–1.6.11): oferecer MTX se sem dor significativa, ectópica não rota &lt; 35 mm sem BCF, hCG &lt; 1.500 UI/L, GIU excluída e seguimento possível; entre 1.500 e &lt; 5.000 UI/L, escolha entre MTX e cirurgia (maior chance de nova intervenção com MTX); hCG nos dias 4 e 7 e depois semanal até negativar.'}
});

add({b:6,k:'6.3 · Tratamento cirúrgico',t:'Quando operar — e como',
 body:`<div class="chips"><span class="chip on">Instabilidade hemodinâmica</span><span class="chip on">Suspeita de ruptura com hemorragia importante</span><span class="chip on">Dor significativa</span><span class="chip on">Tratamento não cirúrgico inadequado</span></div>
 ${S('<p><b>Laparoscopia</b> quando possível — mas a via depende das condições clínicas e da capacidade de controlar a hemorragia com segurança e rapidez.</p>')}
 ${S(`<div class="grid g2">${CARD('red','Salpingectomia','<p>Retirada da tuba comprometida.</p>')}${CARD('teal','Salpingostomia','<p>Abertura da tuba para remover o tecido gestacional, <b>preservando</b> a estrutura tubária.</p>')}</div>`)}
 ${S('<p class="mut">A decisão envolve: extensão do dano · tuba contralateral · desejo reprodutivo · risco de persistência trofoblástica · condições intraoperatórias.</p>')}
 ${S(Q(35))}${S(Q(36))}`,
 sc:[6],
 img:{tema:'Salpingectomia × salpingostomia (esquema)',pos:'Abaixo dos dois cartões',conceito:'Retirada da tuba × abertura e remoção do tecido gestacional.',src:''},
 prof:{show:'Indicações, via, duas técnicas, fatores; Perguntas 35 e 36.',
  explain:`<p>A cirurgia é indicada em situações como instabilidade hemodinâmica, suspeita de ruptura com hemorragia importante, dor significativa ou características que tornam o tratamento não cirúrgico inadequado.</p>
  <p>Quando possível, utiliza-se abordagem laparoscópica. Entretanto, a escolha da via depende das condições clínicas e da capacidade de realizar controle seguro e rápido da hemorragia.</p>
  <p>Existem duas técnicas fundamentais que os alunos devem conhecer.</p>
  <p><b>Salpingectomia:</b> retirada da tuba comprometida.</p>
  <p><b>Salpingostomia:</b> abertura da tuba para remoção do tecido gestacional, preservando a estrutura tubária.</p>
  <p>A decisão envolve extensão do dano, condição da tuba contralateral, desejo reprodutivo, risco de persistência trofoblástica e condições intraoperatórias.</p>`,
  deep:'NICE NG126 (rec. 1.6.15–1.6.16): oferecer salpingectomia, salvo fatores de risco para infertilidade; considerar salpingotomia (termo da NICE) se houver, p. ex., dano na tuba contralateral.'}
});
